<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>教资简答题专项复习题库</title>
<style>
  /* ===================== 基础与配色（柔和护眼） ===================== */
  :root{
    --bg:#eef2ee;            /* 页面背景：柔和米绿 */
    --card:#ffffff;          /* 卡片背景 */
    --ink:#2f3a35;           /* 主文字 */
    --ink-soft:#5d6b63;      /* 次要文字 */
    --line:#e4eae5;          /* 分割线 */
    --primary:#4e9a7a;       /* 主色：护眼绿 */
    --primary-d:#3f8066;     /* 主色深 */
    --primary-l:#eaf4ef;     /* 主色浅 */
    --amber:#b8860b;         /* 口诀色 */
    --amber-l:#fff7e6;        /* 口诀底 */
    --weak:#d96a63;          /* 不熟练红 */
    --shadow:0 1px 3px rgba(40,70,55,.08),0 6px 18px rgba(40,70,55,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:16px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:18px 16px 60px;}

  /* ===================== 顶部标题 ===================== */
  header.top{
    text-align:center;
    padding:14px 10px 6px;
  }
  header.top h1{
    margin:0;
    font-size:26px;
    letter-spacing:1px;
    color:var(--primary-d);
  }
  header.top .sub{
    margin:6px 0 0;
    font-size:14px;
    color:var(--ink-soft);
  }

  /* ===================== 工具栏 ===================== */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;margin:14px 0 12px;box-shadow:var(--shadow);
  }
  .search{
    flex:1 1 180px;min-width:140px;
    border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;font-size:14px;color:var(--ink);background:#fbfdfc;
    outline:none;
  }
  .search:focus{border-color:var(--primary)}
  .tbtn{
    border:1px solid var(--line);background:#fbfdfc;color:var(--ink);
    border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;
    transition:transform .08s ease,box-shadow .15s ease,background .15s ease;
  }
  .tbtn:hover{background:var(--primary-l);box-shadow:0 2px 6px rgba(40,70,55,.10)}
  .tbtn:active{transform:translateY(1px)}
  .tbtn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .tbtn.primary:hover{background:var(--primary-d)}
  .tbtn.warn{color:var(--weak);border-color:#f0d3d0}
  .tbtn.warn:hover{background:#fbeae9}

  /* ===================== 分类导航 ===================== */
  .nav{
    display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;
    scrollbar-width:thin;
  }
  .nav::-webkit-scrollbar{height:6px}
  .nav::-webkit-scrollbar-thumb{background:#cdd8d1;border-radius:3px}
  .tab{
    flex:0 0 auto;white-space:nowrap;
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;
    transition:all .15s ease;
  }
  .tab:hover{border-color:var(--primary)}
  .tab.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(78,154,122,.30)}

  .count{font-size:13px;color:var(--ink-soft);padding:0 4px 6px;}

  /* ===================== 题库卡片 ===================== */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 16px 14px;margin-bottom:14px;box-shadow:var(--shadow);
    transition:box-shadow .18s ease,transform .18s ease,border-color .18s ease;
  }
  .card:hover{box-shadow:0 4px 14px rgba(40,70,55,.14);border-color:#d3e3da}
  .card.weak{border-left:4px solid var(--weak)}
  .card.editing{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-l)}

  .card-head{display:flex;align-items:flex-start;gap:10px;}
  /* 不熟练方框 */
  .weak-box{
    flex:0 0 auto;width:22px;height:22px;margin-top:2px;
    border:2px solid #cfd9d3;border-radius:6px;background:#fff;
    color:#fff;font-size:14px;line-height:18px;text-align:center;cursor:pointer;
    transition:all .15s ease;user-select:none;
  }
  .weak-box.on{background:var(--weak);border-color:var(--weak)}
  .weak-box:hover{border-color:var(--weak)}

  .stem{flex:1 1 auto;cursor:pointer;font-weight:700;font-size:17px;color:var(--ink);}
  .stem .qnum{color:var(--primary-d);margin-right:6px;}
  .stem .stext{font-weight:700;}
  .lvl{
    display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;
    margin-left:8px;vertical-align:middle;transform:translateY(-1px);
  }
  .lvl-imp{background:#fdeceb;color:#d96a63;}
  .lvl-sec{background:#eaf1fb;color:#4a7bc1;}

  .actions{flex:0 0 auto;display:flex;gap:6px;align-items:flex-start;}
  .toggle-btn,.edit-btn,.del-btn{
    border:1px solid var(--line);background:#fbfdfc;color:var(--ink);
    border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer;white-space:nowrap;
    transition:transform .08s ease,box-shadow .15s ease,background .15s ease;
  }
  .toggle-btn{background:var(--primary);border-color:var(--primary);color:#fff}
  .toggle-btn:hover{background:var(--primary-d);box-shadow:0 2px 6px rgba(40,70,55,.15)}
  .edit-btn:hover{background:var(--primary-l);border-color:var(--primary)}
  .del-btn{color:var(--weak);border-color:#f0d3d0}
  .del-btn:hover{background:#fbeae9}
  .toggle-btn:active,.edit-btn:active,.del-btn:active{transform:translateY(1px)}
  .edit-btn:disabled{opacity:.6;cursor:default}

  /* 答案区 */
  .answer{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;}
  .mnemonic{
    display:inline-block;background:var(--amber-l);color:var(--amber);
    border-radius:8px;padding:6px 12px;font-size:14px;margin-bottom:10px;
  }
  .mnemonic b{color:var(--amber)}
  .answer-body{font-size:15.5px;line-height:1.95;color:#37433d;}
  .answer-body .al{padding:1px 0;}
  .answer-body .bullet{position:relative;padding-left:2px;}
  .answer-body[contenteditable="true"]{
    outline:1px dashed var(--primary);border-radius:8px;padding:8px 10px;background:#fcfefd;
  }
  .answer-body[contenteditable="true"] .al:hover{background:rgba(78,154,122,.06)}

  /* 编辑工具栏 */
  .edit-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .tb-btn{
    border:1px solid var(--line);background:#fff;color:var(--ink);
    border-radius:7px;padding:5px 10px;font-size:13px;cursor:pointer;
    transition:transform .08s ease,background .15s ease;
  }
  .tb-btn:hover{background:var(--primary-l)}
  .tb-btn:active{transform:translateY(1px)}
  .tb-btn.warn{color:var(--weak);border-color:#f0d3d0}
  .tb-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}

  /* 新增题目弹窗 */
  .modal-mask{
    position:fixed;inset:0;background:rgba(30,45,38,.45);display:none;
    align-items:flex-start;justify-content:center;padding:40px 14px;z-index:50;overflow:auto;
  }
  .modal-mask.show{display:flex}
  .modal{
    background:#fff;border-radius:14px;width:100%;max-width:560px;padding:20px;
    box-shadow:0 12px 40px rgba(20,40,30,.30);
  }
  .modal h3{margin:0 0 14px;color:var(--primary-d);font-size:18px;}
  .modal label{display:block;font-size:13px;color:var(--ink-soft);margin:10px 0 4px;}
  .modal input,.modal textarea,.modal select{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;
    font-size:14px;font-family:inherit;color:var(--ink);outline:none;background:#fbfdfc;
  }
  .modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--primary)}
  .modal textarea{resize:vertical;min-height:90px;line-height:1.7}
  .modal .row{display:flex;gap:10px}
  .modal .row>div{flex:1}
  .modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .modal .hint{font-size:12.5px;color:var(--ink-soft);line-height:1.7;background:var(--primary-l);border-radius:8px;padding:8px 10px;margin:4px 0 0;}

  /* 同步状态灯 */
  .sync-wrap{font-size:13px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:2px;}
  .sync-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-left:4px;background:#ccc;}
  .sync-dot.ok{background:var(--primary)}
  .sync-dot.syncing{background:#e0a93b}
  .sync-dot.err{background:var(--weak)}
  .sync-dot.off{background:#ccc}

  footer.foot{text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:24px;line-height:1.8;}

  /* ===================== 移动端适配 ===================== */
  @media (max-width:640px){
    header.top h1{font-size:21px}
    .card-head{flex-wrap:wrap}
    .actions{width:100%;justify-content:flex-end;margin-top:8px}
    .stem{font-size:16px;flex-basis:100%}
    .weak-box{margin-top:1px}
    .toolbar{padding:9px}
    .tbtn{padding:7px 10px;font-size:12.5px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>教资简答题专项复习题库</h1>
    <p class="sub">中学 · 教育知识与能力（科二） · 115 题精简刷题版 · 点击题干或「显示答案」即可背诵自查</p>
  </header>

  <!-- 工具栏 -->
  <div class="toolbar">
    <input id="search" class="search" type="text" placeholder="搜索题干 / 答案关键词…" />
    <span class="sync-wrap">同步<span id="syncStatus" class="sync-dot off" title="未启用同步"></span></span>
    <button class="tbtn" id="btnSyncNow">立即同步</button>
    <button class="tbtn" id="btnSyncSettings">同步设置</button>
    <button class="tbtn" id="btnExpand">全部展开</button>
    <button class="tbtn" id="btnCollapse">全部收起</button>
    <button class="tbtn primary" id="btnAdd">＋ 新增题目</button>
    <button class="tbtn warn" id="btnReset">全部重置</button>
  </div>

  <!-- 分类导航 -->
  <nav class="nav" id="nav"></nav>
  <div class="count" id="count"></div>

  <!-- 题库列表 -->
  <div id="list"></div>

  <footer class="foot">
    纯前端静态页面，无需联网。你的「不熟练标记」与「答案批注」自动保存在本机浏览器（localStorage）；<br/>
    刷新页面会重置所有答案的隐藏状态，便于重新自测。
  </footer>
</div>

<!-- 新增题目弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3>新增自定义题目</h3>
    <label>知识点分类</label>
    <select id="addCat"></select>
    <div class="row">
      <div>
        <label>题干</label>
        <input id="addStem" type="text" placeholder="例如：简述××的含义" />
      </div>
    </div>
    <label>口诀（选填）</label>
    <input id="addMnem" type="text" placeholder="记忆口诀，留空则不显示" />
    <label>参考答案（每行一条，用换行分隔）</label>
    <textarea id="addAns" placeholder="①第一点…&#10;②第二点…"></textarea>
    <div class="acts">
      <button class="tbtn" id="addCancel">取消</button>
      <button class="tbtn primary" id="addSave">保存题目</button>
    </div>
  </div>
</div>

<!-- 同步设置弹窗（方案 B） -->
<div class="modal-mask" id="syncMask">
  <div class="modal">
    <h3>同步设置（自动跨设备同步）</h3>
    <label>同步服务器地址</label>
    <input id="syncUrl" type="text" placeholder="例如 https://xxxx.trycloudflare.com" />
    <label>访问密钥（可选，需与后端启动时的 SYNC_KEY 一致）</label>
    <input id="syncKey" type="text" placeholder="留空则不校验" />
    <label class="chk"><input type="checkbox" id="syncSame" /> 同源后端（前端与同步接口部署在同一台服务器时勾选，无需填写地址）</label>
    <p class="hint">设置后，标“不熟练”、新增题目、答案批注都会自动同步到该服务器；<br/>在手机端填入<b>同一个地址</b>（或同样勾选同源后端）即可共享同一份标注。留空则仅本机保存。</p>
    <div class="acts">
      <button class="tbtn" id="syncCancel">取消</button>
      <button class="tbtn primary" id="syncSave">保存</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   教资简答题专项复习题库 —— 纯前端实现
   数据内嵌于下方 QUESTIONS，分类 / 答案显隐 / 标记 / 编辑 均在前端完成
   ========================================================= */

// ====== 题目数据（由 PDF 解析生成，完整保留原题干与答案）======
const QUESTIONS = [{"num": 1, "level": "重要级", "category": "教育基础", "stem": "简述生产力与教育的关系。", "mnemonic": "龟速构防守+两再一新促生产", "answer": "(1)生产力对教育的制约作用—生产力水平决定教育发展水平\n①生产力水平决定教育的规模和速度；\n②生产力制约教育结构和人才培养规格；\n③生产力发展水平制约教育内容、教学方法、教学手段和教学组织形式的变革。\n(2)教育对生产力起到促进作用—教育的经济功能（二级）【2023 上已考，也可辨析题\n考察】\n①教育再生产劳动力；\n②教育再生产科学知识；\n③教育是技术创新和发展的一个重要手段。", "id": 1}, {"num": 2, "level": "重要级", "category": "教育基础", "stem": "简述影响人身心发展的因素。【25 上已考简答，26上辨析题，如学校教育或主观能动力的作用】", "mnemonic": "先天（遗传）后天加环境", "answer": "①遗传。遗传素质为人的身心发展提供了生理前提，使人的发展成为可能；遗传素质\n的成熟程度制约着人的发展过程及其阶段；遗传素质的差异性对人的发展有一定的影\n响；遗传素质具有可塑性。（CocoPolaris：考试时这部分也可以根据自己理解自行简\n化，说出遗传的关键特点即可）\n②环境。环境为人的发展提供了现实性。\n③学校教育。学校教育在人的发展中起主导作用。\n④人的主观能动性。人的主观能动性是人发展的内在动力，对人的发展起决定作用。", "id": 2}, {"num": 3, "level": "重要级", "category": "教育基础", "stem": "简述确立我国教育目的的依据。", "mnemonic": "三人一社会", "answer": "①我国特定的社会政治、经济、文化背景。\n②受教育者的身心发展规律。\n③制定者的教育理想和价值观。\n④我国教育目的确立的理论依据是马克思关于人的全面发展学说。", "id": 3}, {"num": 4, "level": "重要级", "category": "教育基础", "stem": "简述教育制度确立的依据。【2015 上】", "mnemonic": "社会+人+学制", "answer": "（1）社会依据\n①生产力发展水平和科学技术发展状况；②社会政治经济制度；\n③文化传统； ④人口结构和素质；\n（2）人的依据\n青少年儿童身心发展规律。\n（3）学制本身的依据\n本国学制的历史发展和国外学制的影响。", "id": 4}, {"num": 5, "level": "重要级", "category": "教育基础", "stem": "简述全面发展教育的构成及作用。", "mnemonic": "德智体美劳，五育并举。CocoPolaris：每个小点也都可以单独出一道简答题，26 上已考体育简答~", "answer": "德育、智育、体育、美育和劳动技术教育是全面发展教育的基本组成部分。\n①德育：德育是引导学生领悟社会主义思想观点和道德规范，组织和指导学生的道德\n实践，培养学生的社会主义品德的教育。德育在全面发展教育中起着灵魂与统帅的作\n用。\n②智育：智育是授予学生系统的科学文化知识、技能，发展他们的智力的教育。智育\n在全面发展教育中起着基础和前提的作用。\n③体育：体育是增强学生体质，使学生逐步掌握体育运动的基本知识和技能的教育。\n体育是全面发展教育的物质基础。\n④美育：美育是培养学生正确的审美观，发展他们鉴赏美、创造美的能力，培养他们\n的高尚情操与文明素质的教育。美育在全面发展教育中起着动力作用。\n⑤劳动技术教育：劳动技术教育是引导学生掌握劳动技术知识和技能，形成劳动态度\n和习惯的教育。劳动技术教育是全面发展教育的实践基础。", "id": 5}, {"num": 6, "level": "重要级", "category": "教育基础", "stem": "简述美育的原则。", "mnemonic": "", "answer": "①形象性原则：美育强调通过具体、生动的艺术形象，使学生能够直接感知美的形\n象，培养审美能力。\n②情感性原则：美育注重激发学生的情感共鸣，通过艺术作品引导学生感受美、表达\n美，促进情感的发展。\n③活动性原则：美育倡导在实践中学习，通过参与艺术创作、欣赏等活动，增强学生\n的审美体验和实践能力。\n④差异性原则：对学生进行美育应当根据学生年龄、个性差异及审美兴趣爱好的不\n同，选择不同的内容、采用灵活多样的方式进行，使他们对美和艺术的兴趣爱好与美\n的创造才能得到发展。\n⑤创造性原则：在进行美育教育时要求具有丰富的想象力，应引导学生创造性地感\n知、理解和创造美。", "id": 6}, {"num": 7, "level": "重要级", "category": "教育基础", "stem": "简述新时代发展劳动教育的意义。", "mnemonic": "", "answer": "劳动教育的总体目标是：通过劳动教育，使学生能够理解和形成马克思主义劳动观，\n牢固树立劳动最光荣、劳动最崇高、劳动最伟大、劳动最美丽的观念。\n劳动教育是帮助学生形成正确的劳动价值观、养成良好的劳动品质的教育活动。\n劳动教育的价值理念得到强化，有利于学生正确劳动价值观的形成和良好品质的培\n养。\n劳动教育是促进学生全面发展的重要组成部分，能够促进学生优良品德的发展，有利\n于学生掌握知识、形成技能、发展智力、增强体质。", "id": 7}, {"num": 8, "level": "重要级", "category": "教育基础", "stem": "简述教育的文化功能。", "mnemonic": "两传选新促文化", "answer": "① 教育具有传递和保存文化的作用；② 教育具有传播和交流文化的作用；\n③ 教育具有选择和提升文化的作用；④ 教育具有更新和创造文化的作用。", "id": 8}, {"num": 9, "level": "重要级", "category": "教育基础", "stem": "简述学校教育在人的身心发展中起主导作用的原因。【2016 上】", "mnemonic": "三有一训练，控制影响全面", "answer": "①学校教育是有目的、有计划、有组织地培养人的活动，它规定着人的发展方向。\n②学校教育是由受过专门训练的教师进行的，相对其他教育而言效果更好。\n③学校教育能有效地控制和协调影响学生发展的各种因素。\n④学校教育给人的影响比较全面、系统和深刻。", "id": 9}, {"num": 10, "level": "重要级", "category": "教育基础", "stem": "简述学校教育在人的身心发展中起主导作用的表现。", "mnemonic": "（严）规范，速（塑）个性，有延时", "answer": "① 学校教育按社会对个体的基本要求对个体发展方向做出社会性规范；（方向性）\n② 学校教育具有加速个体发展的特殊功能；\n③ 学校教育，尤其基础教育对个体发展的影响具有即时和延时的价值。\n④ 学校教育具有开发个体特殊才能和发展个性的功能。", "id": 10}, {"num": 11, "level": "重要级", "category": "课程与新课改", "stem": "教材（教科书）编写的基本要求/原则。【2014 下+2018 上】", "mnemonic": "科学思想要统一，内在逻辑要统一，突出基础和适用，编排形式要注意，其他学科得兼顾", "answer": "①按照不同学科的特点，体现科学性和思想性。\n②突出基础教育的特点，处理好基础知识和现代科学新成就的关系；\n③在保证科学性的基础上，还要考虑我国社会发展的现状，必须注意到教材对大多数\n学生和学校的适用性。\n④在教材的编排上，要做到知识的内在逻辑与教学法要求的统一。\n⑤教材的编排形式要有利于学习，其形式符合心理学、卫生学、美学要求。\n⑥教材的编写要兼顾其他学科内容之间的关系。", "id": 11}, {"num": 12, "level": "重要级", "category": "课程与新课改", "stem": "简述新课程改革的结构。", "mnemonic": "小综高分初结合，综合实践为必修，农村要为当地服务", "answer": "①九年一贯的义务教育课程：小学以综合课程为主；初中阶段设置分科与综合相结合\n的课程。\n②高中以分科课程为主，设置丰富多样的选修课。\n③从小学至高中设置综合实践活动并作为必修课程。\n④农村中学课程要为当地社会经济发展服务。", "id": 12}, {"num": 13, "level": "重要级", "category": "课程与新课改", "stem": "简述活动中心课程论的观点/简述活动课程的特点。【2016下，本质为同样的题】", "mnemonic": "", "answer": "活动中心课程理论又称儿童中心课程论或经验课程论，代表人物是杜威。主要观点如\n下：\n①教育内容应密切联系儿童的社会生活经验；\n②课程应以儿童活动为中心；\n③课程要从儿童的兴趣和需要出发，使课程满足儿童当前的兴趣和需要。", "id": 13}, {"num": 14, "level": "重要级", "category": "课程与新课改", "stem": "简述课程内容的文本表现形式。【2012 下】", "mnemonic": "计划标准教材", "answer": "课程内容的文本表现形式包括课程计划、课程标准和教材三个层次。\n①课程计划 【可单独考一道简答题】\n课程计划是课程设置与编排的总体规划，是教育行政部门依据一定的教育目的和培养\n目标制定的有关学校教育和教学工作的指导性文件。课程计划体现了国家对学校的统\n一要求，是各级各类学校办学的基本纲领和组织教育教学工作的重要依据，也是学校\n安排整个课程检查、衡量学校工作和质量的基本依据。\n②课程标准【可单独考一道简答题】\n课程标准是在一定课程理论的指导下，依据培养目标和课程方案，以纲要的形式编制\n的关于教学科目内容、教学实施建议以及课程资源开发等方面的指导性文件。它规定\n了学科的教学目的和任务，知识的范围、深度和结构，教学进度以及有关教学法的基\n本要求。课程标准是教材编写、教学、评估和考试命题的依据，是国家管理和评价课\n程的基础。\n③教材\n教材是教师和学生进行教学活动的材料，包括教科书、讲义、讲授提纲、参考书、活\n动指导书以及各种视听材料。其中，教科书和讲义是教材的主体部分，故人们常把教\n科书与讲义简称为教材。", "id": 14}, {"num": 15, "level": "重要级", "category": "课程与新课改", "stem": "简述学科中心课程论的观点。【2013 上】", "mnemonic": "", "answer": "学科中心课程理论又称知识中心课程论，以赫尔巴特、夸美纽斯、斯宾塞和布鲁纳为\n代表。主要观点如下：\n①学校教育的目的在于把人类千百年累积的文化科学知识传递给下一代，这些文化科\n学知识的精华应包含在学校设置的各门学科里。\n②学校课程应以学科的分类为基础，以学科教学为核心，以掌握学科的基本知识、基\n本规律和相应的技能为目标。", "id": 15}, {"num": 16, "level": "重要级", "category": "课程与新课改", "stem": "我国新一轮基础教育课程改革的具体目标有哪些？【2017 上】", "mnemonic": "", "answer": "①实现课程功能的转变：改变课程过于注重知识传授的倾向，强调形成积极主动的学\n习态度，使获得基础知识与基本技能的过程同时成为学会学习和形成正确价值观的过\n程；\n②课程结构的均衡性、综合性、选择性：设置九年一贯的课程门类和课时比例；设置\n综合课程，满足不同地区和学生发展的需求。\n③密切课程内容和生活时代的联系：改变“繁、难、偏、旧”和过分重视书本知识的\n现状，加强课程内容与学生生活以及现代社会和科技发展的联系。\n④改善学生的学习方式：改变死记硬背、接受学习，倡导学生主动参与、乐于探究。\n⑤建立与素质教育理念一致的评价与考试制度：改变过分强调甄选与选拔的功能，发\n展性评价促进学生发展、教师提高和改进教学实践的功能。\n⑥实行三级课程管理：实行国家、地方、学校三级课程管理。", "id": 16}, {"num": 17, "level": "重要级", "category": "课程与新课改", "stem": "简述综合实践活动课程的主要内容。【2013 下+2017 下】", "mnemonic": "一研两社两技", "answer": "①信息技术：是旨在培养学生适应信息时代所需要的信息素养的学习领域。其目的是\n提高学生利用信息技术的意识和能力、对信息的反思和辨别能力，形成信息伦理。\n②研究性学习：是指学生基于自身兴趣并在教师指导下，从自然、社会和学生自身生\n活中选择和确定研究专题，主动获取知识、应用知识、解决问题的学习活动;\n③社区服务与社会实践：是指学生在教师指导下，走出教室，参与社区和社会实践以\n获取直接经验、发展实践能力、增强社会责任感为主旨的学习领域。\n④劳动技术教育：是以学生获得积极劳动体验、以形成良好技术素养为主的多方面发\n展为目标，且以操作性学习为特征的学习领域。", "id": 17}, {"num": 18, "level": "重要级", "category": "教学", "stem": "简述我国现阶段的教学任务。", "mnemonic": "双基+德智体美和个性", "answer": "①传授系统的科学文化基础知识和基本技能。这是教学的首要任务。\n②发展学生的智力，培养学生的创造能力和实践能力。\n③发展学生的体力，提高学生的健康水平。\n④培养学生科学的世界观、良好的思想品德、健康的审美情趣和良好的心理素质。\n⑤关注学生的个性发展。", "id": 18}, {"num": 19, "level": "重要级", "category": "课程与新课改", "stem": "简述隐性课程的特点。", "mnemonic": "弥久普遍非预期潜在", "answer": "隐性课程是以间接的、内隐的方式呈现的课程。主要特点如下：\n①潜在性。隐性课程是以内隐的方式呈现的课程，所以具有潜在性。\n②非预期性。隐性课程与显性课程最大的区别就是没有固定的计划性，所以具有非预\n期性。\n③弥散性。学校的校风、班风以及师生关系都属于隐性课程，所以具有弥散性。\n④普遍性。隐性课程包括物质方面、制度方面以及文化等方面，所以具有普遍性。\n⑤持久性。隐性课程对人的影响是潜在的、长久的，所以具有长久性。", "id": 19}, {"num": 20, "level": "重要级", "category": "教学", "stem": "简述教学过程的结构/基本阶段。", "mnemonic": "机（动机）灵（领会）巩运茶（检查）", "answer": "①激发学习动机。学生的学习兴趣和求知欲是直接推动学生学习的动力。\n②领会知识。领会知识是教学过程的中心环节，包括使学生感知教材和理解教材。\n③巩固知识。巩固知识是教学过程的一个必要环节。学生只有掌握了知识，才能顺利\n学习新的知识和新的材料。\n④运用知识。教学中，运用知识主要通过教学实践来实现的，比如完成书面或口头作\n业等。\n⑤检查知识。检查知识是指教师通过作业、提问、测验等方式对学生的学习效果进行\n考查的过程。", "id": 20}, {"num": 21, "level": "重要级", "category": "教学", "stem": "简述教师备课的基本要求。【2015下】", "mnemonic": "三备+三计划", "answer": "备课—上课前的准备工作，是教好课的前提； 备课的要求要做好三方面的工作：备教\n材、备学生、备教法。同时需要写好三个计划：学期教学进度计划、课题计划和课时\n计划。\n基本要求：\n①要深入准确地把握学科课程标准和教学内容；\n②要有针对性，适应学生的特点；\n③要根据社会发展、科技发展和学生对象的变化，不断更新备课的内容；\n④要充分和周密考虑教学设计诸因素的关系和结构，并做好课前的各种准备。", "id": 21}, {"num": 22, "level": "重要级", "category": "教学", "stem": "简述教学方法选用的依据。", "mnemonic": "依教师、依学生、依目标、依内容、依环境条件", "answer": "①教学目标和教学任务的要求；\n②课程性质和特点（课程内容）；\n③学生的年龄特征；\n④教学时间、设备、条件；\n⑤教师业务水平、实际经验及个性特点；\n⑥教学手段、教学环境等因素。", "id": 22}, {"num": 23, "level": "重要级", "category": "教学", "stem": "简述教学过程是一种特殊的认识过程/简述教学过程的本质。", "mnemonic": "简捷和间接，引导去教育", "answer": "①间接性：主要学习间接经验，学习人类积累的科学文化知识，间接地认识世界。\n②引导性：学生需要在教师指导下认识，不能独立完成。\n③简捷性：学习人类积累的经验和科学文化知识走的是一条认识的捷径，是一种科学\n文化知识的再生产。\n④教育性：教学过程是知情意统一的过程。既要传授知识，又要进行品德教育。", "id": 23}, {"num": 24, "level": "重要级", "category": "教学", "stem": "简述教学过程的基本规律。", "mnemonic": "舰长传教", "answer": "①直接经验与间接经验相统一的规律。学生以学习间接经验为主，同时学生学习间接\n经验要以直接经验为基础，坚持直接经验与间接经验相统一。\n②掌握知识和发展能力相统一的规律。教师不仅要重视知识的传授，还要重视学生能\n力的发展，将二者辩证统一于教学活动中。掌握知识是发展能力的基础；发展能力是\n掌握知识的重要条件；掌握知识与发展能力具有相互转化的内在机制。\n③教师主导作用与学生主体地位相统一的规律。在教学过程中，教师为了学生的学习\n要发挥主导作用，学生在教师的主导作用下发挥学习的积极性。\n④传授知识与思想教育相统一的规律。知识是思想品德形成的基础；学生的思想品德\n的提高又为他们积极地学习知识奠定基础。", "id": 24}, {"num": 25, "level": "重要级", "category": "教学", "stem": "简述传授知识和发展智力之间的辩证关系。【2025 上已考辨析，继续备考简答】", "mnemonic": "", "answer": "教学过程是传授知识的过程，也是发展学生智力的过程。知识的多少与智力高低并不\n等同，二者是相互促进和依存的关系。\n①掌握知识是发展智力的基础。知识的掌握为智力发展提供了可能性，只有具备了某\n方面的知识，才有可能从事某方面的思维活动能力，才能进行分析、判断、抽象和推\n理等活动。\n②智力发展是掌握知识的重要条件。个体对知识的掌握依赖于个体智力水平的高低。\n③掌握知识与发展智力相互转换。知识越多并不意味着智力越高，知识必须是科学\n的、有规律的前提下，智力才有可能提高。\n④在教学过程中，防止单纯抓知识教学或只重视能力发展的片面性，两手都要抓，促\n进学生的全面发展。", "id": 25}, {"num": 26, "level": "重要级", "category": "教学", "stem": "简述教学工作的基本环节。", "mnemonic": "背（备课）上（上课）做（作业）导（辅导）学", "answer": "①备课—上课前的准备工作，是教好课的前提； 备课的要求要做好三方面的工作：备\n教材、备学生、备教法。同时需要写好三个计划：学期教学进度计划、课题计划和课\n时计划。\n②上课—教学工作的中心环节，提高教学质量的关键。\n③课外作业的布置与批改。课外作业是课堂教学的延续和补充。\n④课外辅导。课外辅导是上课的必要补充，是适应学生个别差异、贯彻因材施教的重\n要措施。\n⑤学生学业成绩的评定。它是教学工作的一个重要环节，用来指导和调节教学过程和\n学习过程。", "id": 26}, {"num": 27, "level": "重要级", "category": "教学", "stem": "简述布置课外作业的要求。", "mnemonic": "符合标准、难易适度，别忘提要求，清晰反馈要及时", "answer": "①作业内容要符合课程标准和教科书的要求，要具有代表性，有助于学生巩固知识，\n形成技能，培养能力。\n②作业分量要适当，难易适度。\n③布置作业要提出明确的要求，并规定完成的时间。\n④老师要检查作业并给予及时且清晰的反馈。", "id": 27}, {"num": 28, "level": "重要级", "category": "学习心理", "stem": "简述影响遗忘进程的因素/简述促进知识获得和保持的方法。（CocoPolaris: 两种问法意思一样）", "mnemonic": "人（任务）才（材料）请（情绪）发誓（识记）", "answer": "①学习材料的性质。\n②识记材料的数量和学习程度的大小。\n③记忆任务的长久性与重要性。\n④识记的方法。\n⑤时间因素。\n⑥情绪和动机。\n⑦识记材料的系列位置。", "id": 28}, {"num": 29, "level": "重要级", "category": "学习心理", "stem": "简述如何在教学中应用注意的规律。【26上已考辨析，继续简答备考。每个小点都可以单独出一道简答题，理解记忆】【简述如何培养中学生的注意力。这个题目也可以参照下面答案作答】", "mnemonic": "", "answer": "注意分为无意注意、有意注意和有意后注意。\n1.充分利用无意注意的规律组织教学。\n①创造良好的教学环境。让学生在学习过程中不受外部无关刺激的干扰。\n②注重讲解、板书和教具的使用。\n③恰当安排教学内容，注意教学形式的多样化。\n2.充分利用有意注意的规律组织教学。\n①明确学习的目的和任务，运用有意注意规律进行教学。\n②培养间接兴趣。教师应在课程开始时对学生阐明本学科知识学习的意义和重要性，\n在知识教学中渗透思想教育。\n③合理组织课堂教学，防止学生分心。教学中应避免任务安排的过满，节奏过于紧\n张，应该张弛有度，给学生留有适当的放松休息的时间。\n3.运用有意注意和无意注意相互转换的规律教学。\n不能完全依赖有意注意进行学习，容易引起学生的紧张和疲劳，不能长期坚持。也不\n能单纯依赖无意注意学习，会因缺乏目的性而难以完成学习任务。因此，在教学过程\n中要做到两种注意的交替运用。", "id": 29}, {"num": 30, "level": "重要级", "category": "学习心理", "stem": "简述影响问题解决的主要因素。", "mnemonic": "", "answer": "①问题情境与表征方式。问题情境中的刺激模式与个人的知识结构越接近，问题就越\n容易解决，反之则越困难。\n②心理定势与功能固着。\n③已有的知识经验—迁移。\n④原型启发。\n⑤动机强度与情绪状态。中等强度的动机是解决问题的最佳水平。\n除上述因素外，个体的智力水平、性格特征、认知风格和世界观等个性心理特性也制\n约着问题解决的方向和效果。", "id": 30}, {"num": 31, "level": "重要级", "category": "学习心理", "stem": "简述学生学习的特点。", "mnemonic": "", "answer": "①学生的学习是以掌握间接知识经验为主的。\n②学生的学习是在教师有目的、有计划、有组织地指导下进行的。\n③学生学习的主要任务是掌握系统的科学知识、技能，形成科学的世界观和良好的道\n德品质。\n④学生的学习是在学校班集体中进行的。\n⑤学生的学习具有一定程度的被动性。", "id": 31}, {"num": 32, "level": "重要级", "category": "学习心理", "stem": "简述（奥苏贝尔）有意义学习的实质及条件。", "mnemonic": "材料意义+新旧知识+心向", "answer": "①有意义学习的实质：有意义学习的实质是将新知识与已有知识建立起非人为（内在\n的）的和实质性（非字面）的联系。\n②有意义学习的条件：\n①学习材料的逻辑意义；\n②有意义学习的心向；指学习者具有积极主动地将符号所代表的新知识与认知结构中\n的适当知识加以联系的倾向性。\n③学习者认知结构中必须具有适当的知识，以便与新知识进行联系。", "id": 32}, {"num": 33, "level": "重要级", "category": "学习心理", "stem": "简述学习动机与学习效率的关系。【CocoPolaris:也可考材料题或辨析题，2022上考了辨析题，25上再次被考到辨析，继续简答/材料备考】（即耶克斯-多德森定律，看到这个名字要知道就是学习动机和学习效率的关系）", "mnemonic": "", "answer": "①学习动机与学习效率的关系呈倒 U型曲线关系，即中等强度的动机最有利于任务完\n成。\n②在复杂的任务中，较低的动机水平有利于任务的完成。\n③在简单的任务中，较高的动机水平有利于任务的完成。", "id": 33}, {"num": 34, "level": "重要级", "category": "学习心理", "stem": "简述有效促进学习迁移的教学。【2021下材料题，仍可考简答题】", "mnemonic": "二排", "answer": "①精选教材。\n②合理编排教学内容。\n③合理安排教学程序。\n④教授学习策略，提高迁移意识性。", "id": 34}, {"num": 35, "level": "重要级", "category": "学习心理", "stem": "简述提高问题解决能力的教学/学生问题解决能力的培养。", "mnemonic": "", "answer": "①提高学生知识储备的数量与质量。\n②教授与训练解决问题的方法与策略。\n③提供多种练习的机会。\n④培养独立思考问题的习惯。\n⑤训练逻辑思维能力，提高思维水平。", "id": 35}, {"num": 36, "level": "重要级", "category": "学习心理", "stem": "简述心智技能的培养要求。", "mnemonic": "学自发，重原型； 阶段语言巧使用，个体差异要注意； 科学练习莫忽视", "answer": "①激发学习的积极性与主动性。 ②注意原型的独立性、完备性和概括性。\n③根据培养的阶段特征，正确使用言语。④注意学生的个体差异。\n⑤科学地进行练习。", "id": 36}, {"num": 37, "level": "重要级", "category": "学习心理", "stem": "简述如何有效地组织复习（防止遗忘的方法）。", "mnemonic": "几份饭多多结合，量适当，可过度", "answer": "①及时复习、经常复习。\n②合理分配时间。\n③分散复习和集中复习相结合。\n④反复识记和尝试回忆相结合。\n⑤复习方式要多样化。\n⑥运用多种感官参与复习。\n⑦掌握复习的“量”，数量不宜过多。\n⑧适当过度学习，过度学习程度达到 50%，记忆效果最好，知识最牢固。", "id": 37}, {"num": 38, "level": "重要级", "category": "学习心理", "stem": "简述创造性的培养/如何培养学生的创造性思维。", "mnemonic": "环境+个性+课程", "answer": "1）创设有利于创造性产生的适宜环境。\n①创设宽松的心理环境。\n②给学生留有充分选择的余地。\n③改革考试制度与考试内容。\n2）注重创造性个性的塑造。\n①保护好奇心。\n②解除个体对答错问题的恐惧心理。\n③鼓励独立性和创新精神。\n④重视非逻辑思维。\n⑤给学生提供具有创造性的榜样。\n3）开设培养创造性的课程，进行创造性思维训练。\n有意识地帮助学习通过学习各种思维方法来培养逻辑思维能力。", "id": 38}, {"num": 39, "level": "重要级", "category": "学习心理", "stem": "简述影响迁移的主要因素。", "mnemonic": "", "answer": "①相似性。学习材料之间的相似性；学习情境的相似性。\n②原有认知结构。学习者的背景知识；原有知识经验的概括水平；学习策略的水平。\n③学习心向与定势。定势对迁移的影响表现为两种：促进和阻碍。定势既可以成为正\n迁移的心理背景，也可以成为负迁移的心理背景，或者成为阻碍迁移产生的潜在的心\n理背景。\n除以上影响迁移的一些基本因素外，诸如年龄、智力、学习者态度、教学指导、外界\n的提示与帮助等都在不同程度上影响着迁移的产生。", "id": 39}, {"num": 40, "level": "重要级", "category": "学习心理", "stem": "简述自我效能感理论及其功能。【2016 下简答+2020 下材料】", "mnemonic": "", "answer": "自我效能感指人们对自己是否能够成功地从事某一成就行为的主观判断。自我效能感\n的功能主要体现在四个方面：\n① 决定人们对活动的选择及对该活动的坚持性。\n② 影响人们在困难面前的态度。\n③ 影响新行为的获得和习得行为的表现。\n④ 影响人们活动时的情绪。", "id": 40}, {"num": 41, "level": "重要级", "category": "学习心理", "stem": "简述马斯洛需要层次理论。", "mnemonic": "", "answer": "①生理需要:指人类维持自身生存需要的最基本的需求。\n②安全需要:寻求依赖和保护，避免危险与困难，维持自我生存的需要\n③归属与爱的需要:包括被人爱与热爱他人。\n④尊重的需要:表现为自尊和受到别人尊重。\n⑤求知需要:是克服障碍和解决问题的工具。\n⑥审美需要:对美、秩序和平衡的需要。\n⑦自我实现的需要:是充分发挥个人潜能和才能、实现自我理想的心理需要。", "id": 41}, {"num": 42, "level": "重要级", "category": "学习心理", "stem": "简述如何培养学生的学习动机。/激发学生学习动机的方法。", "mnemonic": "", "answer": "① 创设问题情境，实施启发式教学；\n② 根据作业难度，恰当控制动机水平；\n③ 充分利用反馈信息，妥善进行奖惩；\n④ 正确指导结果归因，促使学生继续努力；\n⑤ 培养学生的自我效能感。", "id": 42}, {"num": 43, "level": "重要级", "category": "学习心理", "stem": "简述加涅的学习结果分类。【2018 上】", "mnemonic": "言语智慧认知动作态度", "answer": "①言语信息的学习：帮助学生解决“是什么”的问题。\n②智慧技能的学习：帮助学生解决“怎么做”的问题。\n③认知策略的学习：用什么方式学。\n④动作技能的学习：又称运动技能，如体操运动、写字技能。\n⑤态度的学习：对家庭、社会关系的认识，对某种活动产生的情感等。", "id": 43}, {"num": 44, "level": "重要级", "category": "学习心理", "stem": "简述桑代克 ——“尝试-错误说”（“试误说”）的教育意义。【也可考材料题】", "mnemonic": "", "answer": "桑代克的“尝试-错误说”认为学习的实质是情境与反应的联结。学习的过程是一种渐\n进的、盲目的、尝试错误的过程。\n①在这一过程中，允许学生犯错，并鼓励学生多试错，从错误中学习，这样获得的知\n识才更牢固。\n②任何学习都应该在学生有准备的情况下进行，要符合“准备律”，不要搞突然袭击。\n③在学习过程中，应加强合理的练习，并注意学习结束后不时地进行练习，符合“练\n习律”的原则。\n④在实际教学过程中，老师应根据“效果律”努力使学生的学习能够得到自我满足的\n积极结果，给予学生积极正向的反馈，防止消极的后果。", "id": 44}, {"num": 45, "level": "重要级", "category": "学习心理", "stem": "简述创造性思维/发散性思维的特征。【CocoPolaris:备注的关键词帮助理解的，考试不需要写哦】", "mnemonic": "", "answer": "创造性思维是以新颖、独特的方式来解决问题的思维方式。\n创造性思维的特征：\na.流畅性：个人面对问题情境时，在规定时间内产生不同观念的数量的多少。【关键\n词：数量】\nb.变通性：个人面对问题情境时，不墨守成规，能随机应变、触类旁通。【关键词：不\n同类型】\nc.独创性：个人面对问题情境时，能想出不同寻常的，与众不同、新奇性的答案。【关\n键词：新奇独特】", "id": 45}, {"num": 46, "level": "重要级", "category": "学习心理", "stem": "简述短时记忆的特点。【2017 上】", "mnemonic": "", "answer": "短时记忆也叫做操作记忆或工作记忆，其特点如下：\n①时间很短：不会超过 1分钟，一般是30 秒左右。\n②容量有限：一般为 7±2个组块。\n③意识清晰：短时记忆是服从当前任务需要，主体正在操作、使用的记忆，主体有清\n晰的意识。\n④操作性强：短时记忆就其心理功能而言具有操作性。\n⑤易受干扰：当有新的信息插入，即阻止了复述时，原有信息就会很快消失，而且不\n能再恢复。", "id": 46}, {"num": 47, "level": "重要级", "category": "学习心理", "stem": "学习策略的分类。【CocoPolaris：每个小点都可以单独出一道简答题，其中认识策略下的内容重点记忆 26 上已考元认知策略的简答，还可以继续辨析题备考】", "mnemonic": "", "answer": "学习策略分为三类：\n1）认知策略。认知策略是加工信息的一些方法和技术，即信息加工的策略。包括复述\n策略、精细加工策略、组织策略。\n①复述策略：指为了在记忆中保持所学信息而对信息进行重复识记的策略。\n②精细加工策略：是一种将新学材料与头脑中已有知识联系起来，从而增加新信息的\n意义的深层加工策略。\n③组织策略：是指整合所学新知识之间、新旧知识之间的内在联系，形成新的知识结\n构的策略。\n2）元认知策略。元认知策略是学生对自己认知过程的认知策略，即对信息加工过程进\n行调控的策略，包括对自己认知过程的了解和控制策略，有助于学生有效地安排和调\n节学习过程。包括计划策略、监控策略、调节策略。\n3）资源管理策略。是指有效地管理和利用环境和资源，以提高学习效率和质量。包括\n时间管理策略、环境管理策略、努力管理策略和资源利用策略。【2023 下已考】", "id": 47}, {"num": 48, "level": "重要级", "category": "学习心理", "stem": "简述韦纳的成败归因理论。（CocoPolaris：材料题也是常考的知识点）", "mnemonic": "", "answer": "①韦纳将活动成败的原因归为六个因素：能力高低、努力程度、任务难度、运气好\n坏、身心状态、外界环境。这六个因素又可以归为三个维度：内部归因和外部归因，\n稳定性归因和非稳定性归因，可控制归因和不可控制归因。\n②其中努力是唯一可控的因素，而能力和任务难度属于稳定性因素。\n③归因理论有助于了解心理活动发生的因果关系，有助于预测个体在某种情况下可能\n产生的学习行为。\n④教师要善于引导学生进行积极归因，引导学生将成功归于自己的能力和努力，将失\n败归于努力的缺乏，从而增强学生的成功期望，提高学生的自信心，增加学生行为的\n坚持性。", "id": 48}, {"num": 49, "level": "重要级", "category": "学习心理", "stem": "简述记忆的过程。", "mnemonic": "编码+存储+提取", "answer": "记忆的过程包括识记、保持、再认和回忆（再现）三个环节，从信息加工的角度看，\n记忆过程是对输入信息的编码、存储和提取的过程。\n①识记是通过感知得到信息并在脑中留下印象的过程，是整个记忆的开始。按识记的\n目的性分为无意识记和有意识记；按识记的方法分为机械记忆和意义识记。识记过程\n就是信息编码的过程。\n②保持是已获得的知识经验在人脑中巩固的过程，是信息的存储。\n③再现（回忆和再认）指过去经历的事物不在眼前，人们在头脑中把它重新呈现出来\n的过程，是信息的提取过程。所有的记忆基本都要经过：编码、存储和提取的过程。", "id": 49}, {"num": 50, "level": "重要级", "category": "学习心理", "stem": "简述最近发展区及启示。（CocoPolaris：2022上考了材料题，继续简答题备考）", "mnemonic": "", "answer": "①最近发展区的含义：维果斯基认为，儿童有两种发展水平：一是儿童现有水平；二\n是即将达到的发展水平。这两种水平之间的差异就是最近发展区。\n②最近发展区的启示：教学应着眼于学生的最近发展区，把潜在的发展水平变成现实\n的发展水平，并创造新的最近发展区。维果斯基特别提出：教学应当走在发展的前\n面。", "id": 50}, {"num": 51, "level": "重要级", "category": "发展心理", "stem": "简述维果斯基的心理发展理论。【2016 上】", "mnemonic": "低级高级两机能，心理发展环境成； 现有水平加最近，符号内化改心理。", "answer": "①文化历史发展理论。维果斯基区分了两种心理机能：一种是作为生物进化结果的低\n级心理机能；另一种是作为历史发展结果的高级心理机能，即以符号系统为中介的心\n理机能。\n②心理发展的实质。维果斯基认为，心理发展是个体的心理自出生到成年，在环境与\n教育的影响下，在低级心理机能的基础上，逐渐向高级机能转化的过程。\n③教学和发展的关系。维果斯基认为，儿童有两种发展水平：一是儿童现有水平；二\n是即将达到的发展水平。这两种水平之间的差异就是最近发展区。\n④内化学说。维果斯基认为运用符号可以使心理活动得到根本改造。具体地说，在儿\n童认知发展的内化过程中，语言符号系统的作用至关重要。", "id": 51}, {"num": 52, "level": "重要级", "category": "发展心理", "stem": "简述影响人格形成的影响因素。", "mnemonic": "遗传+环境+学校教育+主观", "answer": "①生物遗传因素 ②社会文化因素 ③家庭环境因素\n④早期童年经验 ⑤学校教育因素 ⑥个人主观因素", "id": 52}, {"num": 53, "level": "重要级", "category": "发展心理", "stem": "简述不同气质类型的教育措施。【CocoPolaris：之前考过材料题,25上考了辨析】", "mnemonic": "", "answer": "①针对胆汁质的学生，老师应该直截了当地告诉学生，而且对学生的批评一定要有说\n服力;同时要培养学生坚持和自制的精神，豪迈、豪爽、勇于进取的品质，但也应该克\n服鲁莽和莽撞的缺点。\n②针对多血质的学生，老师可以采用多种多样的教育方式。老师要为他们创造条件多\n给他们一些活动的机会。要定期提醒，培养其专一的品质，防止见异思迁\n③针对黏液质的学生，老师可以采取耐心教育的方式。老师要让他们有考虑和做出反\n应的足够时间，要培养其生气勃勃的精神、热情开朗的个性和以诚待人、工作踏实、\n顽强的优点。\n④针对抑郁质的学生，老师可以采取委婉暗示的方式。老师要对其多关心、爱护，不\n要在公开场合对其严厉指责和批评，培养他们亲切、友好、善于交往、富有自信的精\n神。", "id": 53}, {"num": 54, "level": "重要级", "category": "发展心理", "stem": "简述性格的结构特征。", "mnemonic": "", "answer": "① 态度特征（核心）：对周围人、事、物的态度；比如文明礼貌、认真负责、谦虚、\n自私自利、不负责任、自大。\n② 意志特征：自觉确定目标、调节行为；比如果断、盲目、意志力强、随大流。\n③ 情绪特征：情绪活动方式，比如积极乐观、消极悲观。\n④ 理智特征：认知活动中表现出来的稳定的心理特征，比如独立思考、借用他人现成\n的答案。", "id": 54}, {"num": 55, "level": "重要级", "category": "发展心理", "stem": "简述弗洛依德人格发展理论。【CocoPolaris:不同教材上的年龄段不同，这个没有关系】", "mnemonic": "", "answer": "① 口唇期（0-18个月）：通过吮吸、吞咽、咬等获得快感；快感集中在口腔部位。\n② 肛门期（18个月-3岁）：对大便的控制，会帮助他们建立自我，他们意识到，能自\n我控制的事物才是真正属于自己的；快感中心集中在肛门部位。\n③ 性器期（3-6岁）：开始有了性别的意识。他们开始变得更愿意跟异性的父母更亲\n密，同时会对同性的父母显现出排斥心理；开始对生殖器感兴趣。\n④ 潜伏期（6-12岁）：更重视和同性的交往，“性”中立。\n⑤ 生殖期（12-18岁）：心理和生理都趋向成熟，最终做好了生殖的准备，青春期里\n最突出的一个特点就是对异性的那种渴求。", "id": 55}, {"num": 56, "level": "重要级", "category": "发展心理", "stem": "简述埃里克森的人格发展理论。【CocoPolaris:不同教材上的年龄段不同，这个没有关系，同一性同时以辨析题备考】", "mnemonic": "", "answer": "埃里克森将人格发展分为八个阶段，并认为个体在每个发展阶段都会面临一个确定的\n主题或者说一个特定的心理危机。\n第一阶段（0-18个月婴儿期）：这一时期的人格冲突是基本的信任感对基本的不信任\n感，该阶段的目的是发展信任感，克服不信任感。\n第二阶段（18个月-3岁儿童早期）：这一时期的人格冲突是自主对羞怯与怀疑，该阶\n段的目的是培养自主感，克服羞怯与怀疑。\n第三阶段（3-6岁幼儿期/学前期）：这一时期的人格冲突是主动对内疚，该阶段的目\n的是培养主动感，克服内疚感。\n第四阶段（6-12岁童年期/学龄期）：这一时期的人格冲突是勤奋对自卑感，该阶段的\n目的是培养勤奋感，克服自卑感。\n第五阶段（12-18岁青年期）：这一时期的人格冲突是同一性对角色混乱，该阶段的目\n的是建立同一性，防止角色混乱。\n第六阶段（18-30岁成年初期）：这一时期的人格冲突是亲密对孤独，该阶段的目的是\n发展亲密感，避免孤独感。\n第七阶段（30-60岁成年中期）：这一时期的人格冲突是繁殖（充沛感）对停滞感，该\n阶段的目的是获得充沛感，避免停滞感或颓废感。\n第八阶段（60岁以后成年晚期）：这一时期的人格冲突是完美对绝望，该阶段的目的\n是获得完善感，避免绝望与沮丧。", "id": 56}, {"num": 57, "level": "重要级", "category": "发展心理", "stem": "简述玛西亚同一性发展的四种状态。【25下讲义中新补充知识点】", "mnemonic": "", "answer": "①同一性完成：形成自我认同的人，都是经历过探索给自己带来的危机的（高探索）。\n②同一性延缓：是那些正在努力探索自我，寻找自我（高探索），但还没有得到答案的\n人（低承诺）。\n③同一性早闭：处在这种状态中的人，通常已经“获得”了一种自我认同；不过，这\n种认同感并非基于自身的探索和尝试，而是基于他人，尤其是父母。\n④同一性混乱：是那些既不了解自己，不确定未来的发展（低承诺），也并不太关心这\n类问题的人（低探索）。", "id": 57}, {"num": 58, "level": "重要级", "category": "发展心理", "stem": "简述自我效能感及其影响因素", "mnemonic": "", "answer": "① 自我效能感是人们对自己是否能够成功地从事某一成就行为的主观判断。简单理解\n就是自信心。\n② 影响自我效能感形成的因素：学习的成败经验（直接经验）；替代性经验（间接经\n验）；言语劝说（言语说服）；情绪状态。", "id": 58}, {"num": 59, "level": "重要级", "category": "学习心理", "stem": "学校开展心理健康教育的途径。", "mnemonic": "心理课程渗透辅导", "answer": "①开设心理健康教育相关的课程。\n②开设心理辅导活动课。\n③在学科教学中渗透心理健康教育的内容。\n④结合班级 、团队活动开展心理健康教育。\n⑤个别心理辅导或咨询。\n⑥小组辅导。", "id": 59}, {"num": 60, "level": "重要级", "category": "心理辅导", "stem": "简述学校心理辅导的原则。【2017 上】", "mnemonic": "", "answer": "①面向全体学生原则；\n②预防与发展相结合原则；\n③尊重与理解学生原则；\n④学生主体性原则；\n⑤个别化对待原则；\n⑥整体性发展原则。", "id": 60}, {"num": 61, "level": "重要级", "category": "心理辅导", "stem": "简述心理健康教育的主要内容。", "mnemonic": "", "answer": "心理健康教育的主要内容包括：\n①普及心理健康知识；②树立心理健康意识；③了解心理调节方法；④认识心理异常\n现象；⑤掌握心理保健常识和技能。\n其重点是认识自我、学会学习、人际交往、情绪调适、升学择业以及生活和社会适应\n等方面的内容。", "id": 61}, {"num": 62, "level": "重要级", "category": "心理辅导", "stem": "简述教师职业倦怠的特征。", "mnemonic": "", "answer": "①情绪耗竭：丧失工作热情，情绪波动大，容易迁怒他人；\n②去人性化：对工作对象和环境采取冷漠和忽视的态度；\n③个人成就感低：消极地评价自己，贬低自己工作的意义和价值。", "id": 62}, {"num": 63, "level": "重要级", "category": "教师心理", "stem": "简述调整职业倦怠的方法。", "mnemonic": "", "answer": "个体的自我干预：①观念的改变：教师学会正确看待自己的工作；②积极的应对策略\n和归因方式：勇于面对现实，反思自己的压力来源，寻求专业人士帮助；③合理的饮\n食和锻炼：进行合理的饮食和锻炼，缓解压力。\n组织的有效干预：削减过度的工作时间、降低工作负荷、明确工作任务、积极沟通与\n反馈、建立有效的社会支持系统来缓解和消除教师职业倦怠。", "id": 63}, {"num": 64, "level": "重要级", "category": "教师心理", "stem": "简述教师自我促进心理健康的方法/应对职业压力的方法【22 上简答】", "mnemonic": "", "answer": "① 积极认知，树立正确的自我概念：理智、客观地评价自己，合理要求自己，积极看\n待压力对自身的影响。\n② 掌握自我调节的策略：学会进行心理放松，缓解不良情绪。\n③ 主动应对，提高抗压能力：勇于面对，分析造成不良情绪的原因，采取合理的手段\n疏导情绪。\n④ 加强锻炼，保持健康身体。", "id": 64}, {"num": 65, "level": "重要级", "category": "教师心理", "stem": "简述促进中学生形成良好品德的方法。【24 下小学科二中考到】", "mnemonic": "说服榜样群体奖惩有价值", "answer": "①有效的说服；\n②树立良好的榜样；\n③利用群体约定；\n④给予恰当的奖励与惩罚；\n⑤价值辨析。", "id": 65}, {"num": 66, "level": "重要级", "category": "德育", "stem": "简述品德的心理结构特征。", "mnemonic": "知情意行", "answer": "①道德认知：对道德行为准则及其执行意义的认识，是个体品德的核心部分，是学生\n品德形成的基础。\n②道德情感：根据道德观念来评价他人或自己行为时产生的内心体验，是产生品德行\n为的内部动力，是品德实现转化的催化剂。\n③道德意志：个体自觉地调节道德行为，克服困难，以实现道德目标的心理过程，是\n调节品德行为的精神力量。\n④道德行为：实现道德动机的行为意向及外部表现，是道德认知、道德情感、道德意\n志的集中表现，是衡量品德的重要标志，形成良好的道德习惯是道德行为培养的关\n键。", "id": 66}, {"num": 67, "level": "重要级", "category": "德育", "stem": "简述德育过程的基本规律。", "mnemonic": "", "answer": "①德育过程是具有多种开端的对学生知、情、意、行的培养提高过程。\n②德育过程是组织学生的活动和交往，统一多方面教育影响的过程。\n③德育过程是促使学生思想内部矛盾运动的过程。\n④德育过程是一个长期的、反复的、不断前行的过程。", "id": 67}, {"num": 68, "level": "重要级", "category": "德育", "stem": "简述态度/品德形成的阶段/主要内容。", "mnemonic": "", "answer": "一般认为，态度和品德形成过程经历依从、认同和内化三个阶段。\n①依从。依从也称顺从，即表面上接受规范，按规范的要求来行动，但对规范的必要\n性和根据缺乏认识，甚至有抵触情绪。依从又包括从众和服从两种。依从阶段的行为\n具有盲目性、被动性、不稳定性，随情境的变化而变化，行为受外界压力而不是内在\n需要的影响。\n②认同。认同指在思想、情感、态度和行为上主动接受他人的影响，使自己的态度和\n行为与他人相接近。认同实质上就是对榜样的模仿，其出发点就是试图与榜样一致。\n这一阶段的学生的行为具有一定的自觉性、主动性和稳定性的特点。\n③内化。内化是指在思想观点上与他人一致，将自己所认同的思想和自己原有的观\n点、信念融为一体，构成一个完整的价值体系。在内化阶段，个体的行为具有高度的\n自觉性和主动性，并具有坚定性。", "id": 68}, {"num": 69, "level": "重要级", "category": "德育", "stem": "简述中学德育的途径。", "mnemonic": "一教二班三活，25下已考辨析，继续简答备考", "answer": "①思想政治课与其他学科教学。\n②社会实践活动。\n③课外、校外活动。\n④共青团组织的活动。\n⑤班会、校会、周会、晨会与时事政策的学习。\n⑥班主任工作。", "id": 69}, {"num": 70, "level": "重要级", "category": "德育", "stem": "影响态度/品德发展的因素。", "mnemonic": "", "answer": "态度/品德的发展受内部和外部因素的影响。\n1）外部因素：\n①家庭教育。学生的态度和品德特征与家庭的教养方式有密切关系。\n②社会风气。社会上的良好与不良的风气都有可能影响其道德信念与道德价值观的形\n成。\n③学校教育。学校教育在学生品德发展中起主导作用。\n④同伴群体。学生的态度与道德行为在很大程度上受到他们所归属的同伴群体的行为\n准则和风气的影响。\n2）内部因素：\n①认知失调。认知失调是态度改变的先决条件。\n②态度定势。学生事先的心理准备或态度定势影响着对教师的态度。\n③道德认知。学生态度与品德的形成与改变取决于已有的道德判断水平。\n此外，个体的智力水平、受教育程度、年龄等因素也对态度与品德的形成与改变有不\n同程度的影响。\n以下德育原则其他的部分也要一起识记，以讲义完整版为准。", "id": 70}, {"num": 71, "level": "重要级", "category": "德育", "stem": "简述贯彻疏导原则的要求。", "mnemonic": "讲正（正面教育）道（因势利导）", "answer": "疏导原则是指进行德育要循循善诱，以理服人，从提高学生认识入手，调动学生的主\n动性，使他们积极向上。\n①讲明道理，疏导思想。\n②因势利导，循循善诱。\n③以表扬激励为主，坚持正面教育。", "id": 71}, {"num": 72, "level": "重要级", "category": "德育", "stem": "简述尊重与严格要求原则的贯彻要求。", "mnemonic": "爱护尊重严宽适度", "answer": "①爱护、尊重和信赖学生；\n②对学生提出的要求要做到合理正确、明确具体、严宽适度；\n③对学生提出的要求要认真执行、贯彻到底、督促学生切实做到。", "id": 72}, {"num": 73, "level": "重要级", "category": "德育", "stem": "简述知行统一原则的贯彻要求。", "mnemonic": "认识活动，统一作则", "answer": "知行统一的原则是指德育既要重视思想道德的理论教育，又要重视组织学生参加实践\n锻炼，把提高认识和行为养成结合一起，使学生做到言行一致，表里如一。\n①加强思想道德的理论教育，提高学生的思想道德认识。\n②注重组织实践活动，培养道德行为习惯。\n③对学生的评价和要求要坚持知行统一的原则。\n④教育者要以身作则，严于律己。", "id": 73}, {"num": 74, "level": "重要级", "category": "德育", "stem": "简述依靠积极与克服消极因素相结合原则的贯彻要求/长善救失原则。【2016 下】", "mnemonic": "一分为二的转变认识", "answer": "依靠积极因素与克服消极因素相结合原则是指在德育工作中，教育者要善于依靠、发\n扬学生自身的积极因素，调动学生自我教育的积极性，克服消极因素。\n①用“一分为二”的观点，全面分析，客观地评价学生的优点和不足。\n②有意识地创造条件，因势利导，扬长避短，将学生思想中的消极因素转化为积极因\n素。\n③提高学生自我认识、自我评价的能力，启发他们自觉地开展思想斗争，克服缺点，\n发扬优点。", "id": 74}, {"num": 75, "level": "重要级", "category": "德育", "stem": "简述皮亚杰道德发展阶段理论。", "mnemonic": "", "answer": "皮亚杰通过“对偶故事法”，发现并总结了儿童道德认知发展的总规律，即儿童道德发\n展经历从他律到自律的转化过程。10岁是儿童从他律到自律道德转化的分水岭。\n皮亚杰道德发展的四个阶段：\n①自我中心阶段（前道德阶段）2-5岁：没有规则意识，规则对他们没有约束力。\n②权威阶段（他律道德阶段）5-8 岁：服从外部规则，把人们的规定看作是固定的、\n不可变更的，只能根据行为后果来判断对错。\n③可逆阶段（自律道德阶段）8-10岁：儿童已经不把规则看成是一成不变的东西，认\n为所有的人都同意的话，规则是可以改变的。能够同时考虑到行为的动机和结果。\n④公正阶段（公正道德阶段）10-12 岁：公正平等，惩罚应根据各人的具体情况进\n行。", "id": 75}, {"num": 76, "level": "重要级", "category": "德育", "stem": "简述科尔伯格的道德发展理论。", "mnemonic": "", "answer": "柯尔伯格采用“道德两难故事法”进行研究，其中最典型的就是用“海恩兹偷药”的\n故事，让儿童对道德两难问题进行判断。\n柯尔伯格根据儿童对两难问题的判断，把儿童、青少年道德认知发展分为三个水平六\n个阶段，具体内容如下：\n（1）前习俗水平（9 岁以下）【关键词：避罚、利己】\n① 惩罚与服从取向阶段：服从权威或规则只是为了避免惩罚。\n② 相对功利取向阶段：满足自己的需求、评定行为的好坏标准主要看是否符合自我利\n益。\n（2）习俗水平（9-16 岁）【关键词：好孩子、好公民】\n① 寻求认可取向阶段（好孩子）：以人际关系的和谐为导向，谋求别人的赞赏、认\n可。\n② 遵守法规取向阶段：尊重法律的权威，知法、懂法、守法、法律不可改变。\n（3）后习俗水平（16 岁以后）【关键词：法律可改变，道义高于一切】\n① 社会契约取向阶段：认为法律和规范是大家商定的，是一种社会契约。法律可改\n变。\n② 原则或良心取向阶段：公平、平等、尊严、人类普遍的道义高于一切。道德判断的\n最高阶段。", "id": 76}, {"num": 77, "level": "重要级", "category": "德育", "stem": "简述榜样示范法的贯彻要求。【2021 材料题/2025 下已考简答题，继续材料备考】", "mnemonic": "", "answer": "①选好示范的榜样。选好榜样是学习榜样的前提。\n②引导学生深刻理解榜样精神的实质，不要停留在表面模仿层次。\n③激起学生对榜样的倾慕之情。要使榜样能对学生产生激励作用，推动他们前进，就\n需要引导学生了解榜样。\n④引导学生用榜样来调节行为，提高境界。要及时把学生的情感、冲动引导到行动上\n来，使其把敬慕之情转化为道德行为和习惯，逐步巩固、加深这种情感。", "id": 77}, {"num": 78, "level": "重要级", "category": "德育", "stem": "简述说服教育法的要求。", "mnemonic": "", "answer": "①明确的目的性。说服要从学生实际出发，符合学生的需要，切中要害。\n②富有知识性、趣味性。说服要注意给学生以知识、理论和观点，使他们受启发，表\n达的方式要力求生动有趣。\n③注意时机。说服应善于捕捉教育时机，引起学生的情感共鸣。\n④以诚待人。教师的态度要诚恳，情感要真挚，语重心长。", "id": 78}, {"num": 79, "level": "重要级", "category": "德育", "stem": "简述班集体的发展阶段。", "mnemonic": "组核发熟", "answer": "①组建阶段。这一时期是班集体的雏形期。学生在形式上同属于一个班级，实际上还\n是比较孤立的个体，班级成员多数彼此之间还不熟悉，缺乏认同感，行动缺乏组织协\n调。在这一时期，班主任是班级的核心和动力。\n②核心初步形成阶段。这一时期是班级稳定发展时期，班级的组织与功能比较健全，\n班级的核心初步形成。\n③发展阶段。这个阶段学生逐渐学会自我管理。\n④成熟阶段。这个阶段班级会形成平等、和谐、上进的氛围，学生个性得到发展。", "id": 79}, {"num": 80, "level": "重要级", "category": "德育", "stem": "简述班集体形成的标志。", "mnemonic": "健全班风是组织的目标", "answer": "①坚定正确的政治方向与明确的奋斗目标。\n②健全的组织机构与坚强的领导核心。\n③严格的规章制度与严明的组织纪律。\n④正确的集体舆论与良好的班风。", "id": 80}, {"num": 81, "level": "重要级", "category": "班级管理", "stem": "简述教师成长与发展的基本途径。", "mnemonic": "看别人，看自己，多练习，多反思，25下已考简答，仍然可以以材料题形式考察", "answer": "①观摩和分析优秀教师的教学活动。（看别人）\n②开展微格教学。（看自己）\n③进行专门训练。（多练习）\n④反思教学。（多反思）", "id": 81}, {"num": 82, "level": "重要级", "category": "班级管理", "stem": "简述班主任的个别教育工作。【先进生、中等生和后进生皆可单独考简答】", "mnemonic": "", "answer": "1）先进生工作。班主任应注意以下几个方面：\n①严格要求，防止自满。\n②不断激励，战胜挫折。\n③消除嫉妒，公平竞争。\n④发挥优势，带动全班进步。\n2）中等生工作。班主任应注意以下几个方面：\n①重视对中等生的教育。\n②根据中等生的不同特点，有的放矢地进行个别教育。\n③针对中等生信心不足的特点，给中等生创造充分展示自己才能的机会，增强他们的\n自信心。\n3）后进生工作。班主任应注意以下几个方面：\n①关心爱护后进生，尊重他们的人格。\n②培养和激发他们的学习动机。\n③树立榜样，增强是非观念。\n④根据个别差异，因材施教。\n⑤善于发掘后进生身上的“闪光点”，增强其自信心和集体荣誉感。\n⑥对后进生的教育要持之以恒。", "id": 82}, {"num": 83, "level": "重要级", "category": "教师心理", "stem": "简述素质教育的内涵。", "mnemonic": "", "answer": "①素质教育强调要面向全体学生、为了全体学生开展教育。\n②素质教育是促进学生德智体美各方面全面、均衡发展的教育。\n③素质教育强调发挥教师和学生的主体性，关注学生个性和创造力发展的教育。\n④素质教育强调要培养学生的基本素质和终身学习能力。", "id": 83}, {"num": 84, "level": "重要级", "category": "班级管理", "stem": "简述家庭对学生发展的影响。", "mnemonic": "", "answer": "为促进学生的健康成长和发展，家长应努力营造一个和谐稳定、积极向上的家庭氛\n围，为孩子充分提供情感支持、教育指导、经济保障和心理支持。同时，家长还需要\n意识到自身言行对于孩子的影响，父母之间应相互尊重、支持，为孩子树立榜样。\n①情感支持与安全感：家庭为孩子提供稳定、安全的情感环境，满足其情感需求，能\n够增强其自信心和安全感。\n②经济条件和生活环境：家庭经济条件决定了孩子接受教育资源的质量与机会，能够\n促进或阻碍孩子的发展。\n③家庭教育与价值观：父母是孩子的第一任老师，父母的教育方式和价值观直接影响\n孩子的认知发展和道德品德的形成。\n④榜样作用：父母的言行、行为习惯、道德品质都会直接影响孩子的发展，孩子会通\n过观察和模仿父母的行为学习和发展自己的行为习惯。\n⑤家庭结构：单亲家庭、重组家庭以及亲子关系等也会对孩子的身心发展造成影响。\n⑥家长的受教育程度：孩子的认知发展受父母或家庭内主要的教育承担人的知识水平\n和类型的制约。\n【以上回答仅作参考，大家也可从其它角度联系实际进行论述。】\n", "id": 84}, {"num": 1, "level": "次重要级", "category": "教育基础", "stem": "简述 20世纪以后教育的特点。", "mnemonic": "全民多现身", "answer": "①教育的终身化。它包括各个年龄阶段的各种方式的教育。\n②教育的全民化。教育必须面向所有人，即人人都有接受教育的权利。\n③教育的民主化。教育民主化是对教育等级化、特权化和专制化的否定。\n④教育的多元化。具体表现为培养目标的多元化和办学形式的多元化等。\n⑤教育的现代化。教育现代化是指现代科学技术在教育上的运用，并由此引起教育思\n想、教育观念等的变化。", "id": 85}, {"num": 2, "level": "次重要级", "category": "教育基础", "stem": "简述个体身心发展的一般规律。", "mnemonic": "顺序阶段不平衡，个别互补有差异", "answer": "①个体身心发展具有顺序性。它是一个从低级到高级，从简单到复杂的连续不断的发\n展过程。\n②个体身心发展具有阶段性。不同年龄阶段面临不同的发展任务。\n③个体身心发展具有不平衡性。个体的发展并不总是按相同的速度直线前进的。\n④个体身心发展具有互补性。这种互补既体现在身体机能和身体机能之间，也体现在\n身体机能和心理机能之间。\n⑤个体身心发展具有个别差异性。这种差异性主要体现在群体和群体之间以及个体和\n个体之间。", "id": 86}, {"num": 3, "level": "次重要级", "category": "教育基础", "stem": "我国教育目的基本精神。", "mnemonic": "劳动个性全面建设接班人", "answer": "①我们要求培养的人是社会主义事业的建设者和接班人，因此要坚持思想政治道德素\n质与科学文化知识能力的统一。\n②我们要求学生在德、智、体等方面全面发展，要求坚持脑力劳动与体力劳动两方面\n的和谐发展。\n③适应时代发展的要求，强调学生个性的发展，培养学生的创造精神和实践能力。\n④教育必须与生产劳动相结合，这是教育目的实现的根本途径。", "id": 87}, {"num": 4, "level": "次重要级", "category": "教育基础", "stem": "简述政治经济制度与教育的关系。", "mnemonic": "体内性质两权一目的+人鱼公主促政治", "answer": "（1）政治经济制度对教育的制约作用 【可单独一道简答题】\n①政治经济制度决定教育的性质；\n②政治经济制度决定教育的宗旨与目的；\n③政治经济制度决定教育的体制和教育的内容；\n④政治经济制度决定教育领导权；\n⑤政治经济制度决定受教育权。\n（2）教育对政治经济制度的影响作用—教育的政治功能【2018 下】【可单独一道简答\n题】\n①教育为政治经济制度培养所需要的人才；\n②教育促进政治民主化；③教育是一种影响政治经济制度的舆论力量；\n④教育能够完成年青一代的政治社会化。", "id": 88}, {"num": 5, "level": "次重要级", "category": "教育基础", "stem": "简述现代教育制度的发展趋势。", "mnemonic": "义务要延长，职业要综合，高等要大众，终身要建构", "answer": "①义务教育的范围逐渐扩大，年限不断延长。\n②普通教育和职业教育朝着相互渗透的方向发展。\n③高等教育要大众化。\n④终身教育体系的建构。", "id": 89}, {"num": 6, "level": "次重要级", "category": "课程与新课改", "stem": "简述隐性课程的表现形式/基本类型。", "mnemonic": "物质制度心理与观念，25下已考简答，显性课程和隐性课程内在的联系，第③点出发可以很好地阐述内在联系", "answer": "①物质性隐性课程。包括学校建筑、教室的布置、校园环境等。\n②制度隐性课程。包括学校管理体制、学校组织机构、班级管理方式等。\n③观念性隐性课程。包括隐藏于显性课程中的意识形态、校风、班风、教师与领导的\n教育理念、价值观、知识观、教学指导思想和风格等。\n④心理性隐性课程。包括学校人际关系状况，师生特有的心态和行为方式等。", "id": 90}, {"num": 7, "level": "次重要级", "category": "课程与新课改", "stem": "简述新课程改革背景下的评价观。", "mnemonic": "主体多元、形式多样、内容综合、标准分层，重过程重发展。", "answer": "新课改强调改变课程评价过分强调甄选和选拔的功能，发挥评价促进学生发展、教师\n提高和改进教学实践的功能。\n①评价的根本目的在于促进发展。\n②体现最新的教育观念和课程评价发展的趋势。\n③评价内容综合化。\n④评价标准分层化。\n⑤评价方式多样化。\n⑥评价主体多元化。\n⑦关注发展过程。\n⑧多用发展性评价。", "id": 91}, {"num": 8, "level": "次重要级", "category": "课程与新课改", "stem": "简述课程设计的目标模式。", "mnemonic": "定目标，两经验，一评价", "answer": "课程设计的目标模式是以目标为课程开发的基础和核心。泰勒提出了关于课程编制的\n“四段论”：目标、内容、方法和评价。\n①确定目标（目标）：学校应该达到哪些教育目标？\n②选择教育经验（内容）：提供哪些教育经验才能实现这些目标？\n③组织经验（方法）：怎样才能有效地组织这些教育经验？\n④评价结果（评价）：怎样才能确定这些目标真正得到实现？", "id": 92}, {"num": 9, "level": "次重要级", "category": "教学", "stem": "简述循序渐进教学原则的含义及贯彻要求。", "mnemonic": "重系统、需灵活、主次分明、层次清", "answer": "循序渐进教学原则是指教学要按照学科知识的内在逻辑体系和学生认识能力发展的顺\n序进行教学，使学生系统地掌握基础知识、基本技能，形成严密的逻辑思维能力。\n贯彻要求如下：\n①按照教材的系统性进行教学。②注意主要矛盾，解决好重点与难点教学。\n③按照学生的认识规律，由浅入深、由易到难地进行教学。", "id": 93}, {"num": 10, "level": "次重要级", "category": "教学", "stem": "简述直观性教学原则的含义及贯彻要求。", "mnemonic": "观实物、察言语、形象感性", "answer": "直观性教学原则是指在教学中要通过学生观察所学事物或教师语言形象地描述，引导\n学生形成对所学事物、过程的清晰表象，丰富他们的感性认识，从而使他们能够正确\n理解书本知识和发展认识能力。\n贯彻要求如下：\n①正确选择直观教具和教学手段。\n②直观教具的演示要与语言讲解结合起来。\n③要重视运用言语直观。\n④防止直观的不当和滥用。", "id": 94}, {"num": 11, "level": "次重要级", "category": "教学", "stem": "简述理论联系实际教学原则的含义及贯彻要求。", "mnemonic": "小联乡下训练运用能力", "answer": "理论联系实际教学原则是指教学要以学习基础知识为主导，从理论与实际的联系上去\n理解知识，注意运用知识分析问题和解决问题，达到学懂学会，学以致用的目的。\n贯彻要求如下：\n①书本知识的教学要注重联系实际。\n②重视培养学生运用知识的能力。\n③正确处理知识教学与技能训练的关系。\n④补充必要的乡土教材。", "id": 95}, {"num": 12, "level": "次重要级", "category": "教学", "stem": "简述启发性教学原则的含义及贯彻要求。【2022上简答，仍可考材料题】", "mnemonic": "小猪（主）动手毒（独）死农民", "answer": "启发性教学原则是指在教学中教师要承认学生是学习的主体，注意调动他们的学习主\n动性，引导他们独立思考，积极探索，生动活泼地学习，自觉掌握科学知识，提高分\n析问题和解决问题的能力。\n贯彻要求如下：\n①加强学习目的性教育，调动学生学习的主动性。这是启发的首要问题。\n②启发学生独立思考，发展学生的逻辑思维能力。\n③鼓励学生动手，培养他们独立解决问题的能力。\n④发扬教学民主。", "id": 96}, {"num": 13, "level": "次重要级", "category": "教学", "stem": "简述讲授法的概念和要求。", "mnemonic": "", "answer": "讲授法是教师运用口头语言系统向学生传授知识的一种方法。分为讲述、讲解、讲\n读、讲演四种。\n运用讲授法的基本要求是：\n①教师要注意启发诱导学生；\n②教师要认真组织教学内容；\n③教师要讲究语言艺术；\n④教师要组织学生听讲。", "id": 97}, {"num": 14, "level": "次重要级", "category": "教学", "stem": "简述贯彻科学性和思想性相统一教学原则的基本要求。【2018 上材料+2018下简答】", "mnemonic": "", "answer": "科学性与思想性统一原则又叫科学性与教育性相结合原则，是指在教学中，教师既要\n把现代先进科学的基础知识和基本技能传授给学生，又要结合知识、技能中蕴含的德\n育因素，对学生进行政治、思想教育和道德品质教育。\n贯彻要求：\n①保证教学的科学性。教师传授给学生的知识应该是科学的，同时，讲授也应遵循科\n学性要求，表达要准确，实验、演示、计算要精确、规范。\n②发掘教材的思想性，对学生进行品德教育。中小学教学涉及的内容均直接或间接地\n蕴含着思想性，教师教学必须要给予足够重视，根据教材章节内容的特点，把思想性\n与科学性融于一体，做到既教书又育人。\n③教师要不断提高自己的专业水平和思想素质。教学的科学性和思想性主要靠教师来\n保障。教师必须不断更新知识，提高文化水平和思想修养，从而提高知识教学的科学\n化程度，并通过自己内在的思想观念、精神面貌、情感状态、行为方式等对学生品德\n的养成产生积极影响。", "id": 98}, {"num": 15, "level": "次重要级", "category": "教学", "stem": "简述一堂好课的基本标准。【2019下简答】", "mnemonic": "", "answer": "①目的明确。老师清晰地知道这堂课需要学生掌握的知识和技能以及学会的方法是什\n么。\n②内容正确。老师讲授的内容必须是科学的、准确且符合逻辑的。\n③方法得当。教学有法，教无定法，老师要善于对各种教学方法创造性地加以运用，\n力求使教学取得较好的效果。\n④结构合理、重点突出。老师上课时要有清晰的结构，重难点突出，由浅入深。\n⑤语言艺术。老师上课语言要流畅、生动、浅显易懂。\n⑥气氛热烈。整个课堂要始终在老师的指导下充分发挥学生学习的积极性。\n⑦板书有序。板书清晰工整，重点明晰。\n⑧态度从容。老师上课时自信大方，适当运用肢体语言。", "id": 99}, {"num": 16, "level": "次重要级", "category": "教学", "stem": "简述班级授课制的优缺点。优点：", "mnemonic": "制度保证质量行，经济培养人才；教师主导作用显，集体学习互助强；系统知识学生得，管理检查不能少。", "answer": "①有严格的制度保证教学的正常开展，达到一定质量。\n②有利于经济有效地大面积培养人才。\n③有利于发挥教师的主导作用。\n④有利于发挥学生集体的作用。\n⑤有利于学生获得系统的科学知识。\n⑥有利于教学管理和教学检查。\n缺点：【口诀：主体发挥难体现，探索创造受局限；个别差异难适应，多样内容方法\n缺；交流启发少实现。】\n①不利于学生主体性的发挥。\n②不利于培养学生的探索精神、创造能力和实践能力。\n③不利于适应学生的个别差异、因材施教。\n④不能很好地适应教学内容和教学方法的多样化。\n⑤不利于学生之间真正的交流和启发。", "id": 100}, {"num": 17, "level": "次重要级", "category": "学习心理", "stem": "简述注意的品质/特性。【25 下材料题已考，继续简答或辨析备考】", "mnemonic": "", "answer": "①注意的广度。也称注意的范围，指在同一时间内，人们能够清楚地知觉出的对象的\n数目。\n②注意的稳定性。也称注意的持久性，指注意集中在一定对象上的持续时间。\n③注意的分配。指在同一时间内把注意力集中于两种或两种以上对象或活动上的特\n性。\n④注意的转移。指主体根据新的任务，主动地把注意从一个对象转移到另一个对象或\n由一种活动转移到另一种活动的现象。", "id": 101}, {"num": 18, "level": "次重要级", "category": "学习心理", "stem": "简述操作（动作）技能的培养要求。【2016 上】", "mnemonic": "", "answer": "①准确的示范与讲解； ②必要而适当的练习；\n③充分而有效的反馈； ④建立稳定清晰的动觉。", "id": 102}, {"num": 19, "level": "次重要级", "category": "学习心理", "stem": "简述建构主义学习理论/简述建构主义的知识观、学生观、学习观。【CocoPolaris:每个小点仍可以单独出一道简答题】【2017下+2021 上】", "mnemonic": "", "answer": "①建构主义知识观\n①知识并不是对现实的准确表征，也不是最终答案，而只是一种解释、一种假设。\n②知识并不能精确地概括世界的法则。\n③对于知识的理解由学生自己的经验背景建构。\n②建构主义学生观\n①建构主义强调学生经验世界的丰富性，强调学生的巨大潜能。\n②建构主义强调学生经验世界的差异性。\n③建构主义学习观\n①学习的主动建构性。\n②学习的社会互动性。\n③学习的情境性。", "id": 103}, {"num": 20, "level": "次重要级", "category": "学习心理", "stem": "简述学习动机的定义和功能。【2018上】", "mnemonic": "", "answer": "（1）定义：学习动机是指激发个体进行学习活动，维持已引起的学习活动，并使行为\n朝向一定学习目标的一种心理倾向或内部动力。学习动机的两个基本成分是学习需要\n和学习期待。\n（2）功能：\n①激发功能\n②指向功能\n③维持功能\n④调节功能", "id": 104}, {"num": 21, "level": "次重要级", "category": "学习心理", "stem": "简述培养学生想象力的方法。", "mnemonic": "引观察、勤思考、学知识、练想象、爱幻想（第 2点口诀，如果题目问培养想象力的方法可以只回答第 2点）", "answer": "（1）在教学中发展学生的再造想象\n①扩大学生头脑中的表象储备。\n②帮助学生真正弄懂描述中关键性词句的实物标志的概念。\n③唤起学生对教材的想象，以加深学生对知识的理解和巩固。\n（2）在教学中培养学生的创造想象\n①引导学生学会观察，丰富学生的表象储备。\n②引导学生积极思考，有利于打开想象力的大门。\n③引导学生努力学习科学文化知识，扩大学生的知识经验以发展学生的空间想象能\n力。\n④结合学科教学，有目的训练学生的想象力。\n⑤引导学生进行积极的幻想。\n⑥注意发展学生的语言能力。想象是在语言的调节下进行的，并通过语言来表现。发\n展学生的语言能力有利于提高学生的想象力水平。", "id": 105}, {"num": 22, "level": "次重要级", "category": "发展心理", "stem": "简述中学生情绪的特点和指导学生有效调节方法。【2018材料题】", "mnemonic": "", "answer": "(1)中学生的情绪特点：(2022下+2024下已考简答题，继续材料备考)\n①爆发性和冲动性 ②不稳定性和两极性\n③外露性和内隐性(掩饰性) ④心境化和持久性\n(2)指导学生调节情绪的方法：\n①教会学生形成适宜的情绪状态。\n②丰富学生的情绪体验。\n③引导学生正确看待问题。\n④教会学生情绪调节的方法。\n⑤通过实际锻炼提高学生的情绪调节能力。", "id": 106}, {"num": 23, "level": "次重要级", "category": "发展心理", "stem": "简述如何培养学生的能力。", "mnemonic": "", "answer": "①注重对学生早期能力的培养；\n②教学中要加强知识与技能的学习与训练；\n③教学中要针对学生的能力差异因材施教；\n④在教学中积极培养学生的元认识能力和创造力；\n⑤社会实践活动是培养学生能力的基本途径；\n⑥要注意培养学生的非智力因素。", "id": 107}, {"num": 24, "level": "次重要级", "category": "发展心理", "stem": "影响学生能力形成的因素。", "mnemonic": "先早教，再实践，靠努力", "answer": "①先天素质。（遗传因素）\n②早期经验。（环境因素）\n③教育与教学。\n④社会实践。\n⑤主观努力。（内在因素）", "id": 108}, {"num": 25, "level": "次重要级", "category": "心理辅导", "stem": "简述压力的来源。", "mnemonic": "躯体刺激温度变，心理冲突期望偏； 社会生活变化大，调整适应压力现。", "answer": "压力是人们对刺激产生的一种心理与生理上的综合感受。压力来源主要有以下几个方\n面：\n①躯体性压力源：指通过对人的躯体直接发生剌激作用而造成身心紧张状态的刺激物,\n包括物理的、化学的、生物的刺激物。如过高或过低的温度、微生物、变质食物等这\n一类刺激是引起生理压力和压力的生理反应的主要原因。\n②心理压力源：指来自人们头脑中的紧张性信息。例如心理冲突与挫折、不切实际的\n期望、不样预感以及与工作责任有关的压力和紧张等。\n③社会性压力源：指造成个人生活方式上的变化,并要求人们对其做出调整和适应的情\n境与事件。社会性压力源包括个人生活中的变化,也包括社会生活中的重要事件。个人\n生活的改变常常会给人带来压力。", "id": 109}, {"num": 26, "level": "次重要级", "category": "发展心理", "stem": "简述皮亚杰将儿童认知发展划分为哪几个阶段？【2022上已考简答，仍以材料题备考】", "mnemonic": "", "answer": "1）感知运动阶段（0-2 岁）\n①此阶段的儿童主要表现为感觉和动作的发展；\n②这一阶段的一个显著标志是儿童在 9-12 个月时逐渐获得客体永恒性。\n2）前运算阶段（2-7 岁）， 此阶段的特征有：\n①“万物有灵论”。 ②一切以自我为中心。\n③思维具有不可逆、刻板性。④思维不具有守恒性。\n3）具体运算阶段（7-11 岁），此阶段的特征有：\n①思维形成了守恒概念； ②思维具有可逆性；\n③思维具有去自我中心性；④能进行具体逻辑推理，简单抽象思维；\n⑤能理解原则和规则，但只能刻板遵守规则，不敢改变；\n⑥具有多维思维。\n4）形式运算阶段（11 岁以后），此阶段的特征有：\n①思维发展水平已接近成人。\n②具有抽象逻辑思维，能理解符号的意义、隐喻和直喻，能对事物进行一定的概括。\n③进行假设--演绎推理。\n④认识命题之间的关系。\n⑤思维具有可逆、补偿、灵活性。", "id": 110}, {"num": 27, "level": "次重要级", "category": "心理辅导", "stem": "简述应对压力的方法。（CocoPolaris:能够写出四五个。）", "mnemonic": "", "answer": "① 升华：将心理欲望从社会不可接受转向社会可接受的方向的过程。\n② 补偿：由于本身的某种缺陷而达不到既定目标时，用另一种目标代替。\n③ 退行：受挫时，行为表现会显得十分幼稚，和年龄不符。\n④ 幽默：用机智、双关、自嘲等方式化解尴尬。\n⑤ 宣泄：一吐为快，将不满发泄出来。\n⑥ 认同：建立于他人或团体的目标同一性，或将自己与崇拜的人视为一体。\n⑦ 文饰-合理化：酸葡萄心理+甜柠檬心理+推诿。\n⑧ 投射：以己度人。\n⑨ 认知重组：对挫折情境的重新认识与评价。", "id": 111}, {"num": 28, "level": "次重要级", "category": "班级管理", "stem": "简述班主任工作的基本内容。【2017 下】", "mnemonic": "", "answer": "① 了解和研究学生；其中观察法是最基本的方法。\n② 组织和培养班集体； ③ 建立学生成长档案；\n④ 组织班会和课外活动；⑤ 协调各种教育影响；\n⑥ 操行评定； ⑦ 班主任计划和总结。", "id": 112}, {"num": 29, "level": "次重要级", "category": "班级管理", "stem": "简述班主任应具备的基本条件。【2018 上】", "mnemonic": "", "answer": "班主任应具备思想道德素质、知识素质、能力素质和身心素质。这些基本素质也是一\n名合格班主任应具备的基本条件。\n①思想道德素质。思想道德素质是班主任首先应具备的基本素质。\n②知识素质。知识素质包括所授学科的专业基础知识和教学法，一定的教育学、心理\n学、管理学知识与能力，广博的文化知识等。\n③能力素质。能力素质包括较强的组织管理能力、创新学习能力、思想教育能力、交\n往和表达能力、自我反思和自我控制能力。\n④身心素质。", "id": 113}, {"num": 30, "level": "次重要级", "category": "教师心理", "stem": "如何建立教师的威信/建立教师威信的途径。【2012下】", "mnemonic": "", "answer": "① 培养自身良好的道德品质：对本职工作高度负责，兢兢业业，不计名利。\n② 培养良好的认知能力和性格特征：教师需要勤奋刻苦，好学多思，拥有独特的见解\n和渊博的知识；同时，还应努力磨炼自己的意志品质，增强挫折耐受力，养成宠辱不\n惊、积极进取的品格。\n③ 给学生以良好的第一印象：如果教师给学生的第一印象良好，就会很快赢得学生的\n信赖，为树立威信打下基础。\n④ 注重良好仪表、风度和行为习惯的养成：教师的仪表、生活作风和行为习惯对威信\n的获得也有重要影响。\n⑤ 做学生的朋友与知己：教师成为学生的朋友，一方面，学生容易产生近师、亲师、\n信师的心理效应；另一个方面，教师主动关心、爱护、体谅学生，满足学生理解求知\n的需要，教师就能迅速在学生中建立威信。", "id": 114}, {"num": 31, "level": "次重要级", "category": "班级管理", "stem": "简述班级管理的原则。（24下已考简答，材料题备考）", "mnemonic": "", "answer": "① 全员激励的原则。班级管理应面向全体学生，激励每位学生，充分调动每个学生的\n积极性和创造性，实现班级总目标和个体目标。\n② 平行管理原则。既通过对集体的管理去间接地影响个人，又通过对个人的直接管理\n去影响集体，从而把对集体和个人的管理结合起来，以达到更好的管理效果。\n③ 自主参与原则。班级成员参与管理，发挥学生的主体性。\n④ 教管结合原则。指把班级的教育工作和对班级的管理工作辩证地统一起来。具体地\n说，就是班级管理者对学生既要坚持正面引导，耐心教育，又要凭借必要的规章制度\n要求学生，约束其行为，实行严格教育管理。只有这样，才能获得教育的实际效果。\n⑤公平公正的原则。班级管理应遵循公平公正的原则，对待学生一视同仁，不偏袒任\n何一个学生。", "id": 115}];

// 固定的分类顺序（与教资科目二常规考点一致）
const CATEGORY_ORDER = ['教育基础','课程与新课改','教学','德育','学习心理','发展心理','心理辅导','班级管理','教师心理'];

// 本地存储键
const STORE = { edits:'jzq_edits_v1', marks:'jzq_marks_v1', added:'jzq_added_v1' };
function loadJSON(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function saveJSON(k, v){ localStorage.setItem(k, JSON.stringify(v)); }

// 运行时状态（答案隐藏状态仅存在于内存，刷新即重置）
let edits = loadJSON(STORE.edits, {});   // { id: 答案HTML }
let marks = loadJSON(STORE.marks, {});   // { id: true }
let added = loadJSON(STORE.added, []);   // 用户新增题目数组
let currentCategory = '全部';

// 同步配置（方案 B）：服务器地址与可选密钥，存于本机
// sameOrigin: true 表示前端与 /api/state 同源（部署在同一服务器），此时无需填写地址
let SYNC = loadJSON('jzq_sync_v1', { url: '', key: '', sameOrigin: false });
function syncEnabled(){ return !!(SYNC && (SYNC.url || SYNC.sameOrigin)); }
function apiBase(){ return SYNC.sameOrigin ? '' : (SYNC.url || '').replace(/\/$/,''); }
let syncTimer = null;
function schedulePush(){
  if(!syncEnabled()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 600);
}
function setSyncStatus(s){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.className = 'sync-dot ' + s;
  el.title = { ok:'已同步', err:'同步失败', syncing:'同步中', off:'未启用同步' }[s] || '';
}
// 把远端数据「合并」进本地：不覆盖、只补充
//   - added：按 id 去重做并集（本地未推送的新题不会丢）
//   - marks / edits：合并键（任一侧有则保留）
function mergeIntoLocal(remote){
  if(!remote) return false;
  let changed = false;
  const rm = remote.marks || {};
  for(const k in rm){ if(rm[k] && !marks[k]){ marks[k] = true; changed = true; } }
  const re = remote.edits || {};
  for(const k in re){ if(re[k] && !edits[k]){ edits[k] = re[k]; changed = true; } }
  const ra = remote.added || [];
  const ids = new Set(added.map(function(q){ return q.id; }));
  ra.forEach(function(q){ if(q && q.id != null && !ids.has(q.id)){ added.push(q); ids.add(q.id); changed = true; } });
  if(changed){
    saveJSON(STORE.edits, edits); saveJSON(STORE.marks, marks); saveJSON(STORE.added, added);
    buildNav(); render(); updateCount();
  }
  return changed;
}
// 一次完整同步：拉取 → 合并进本地 → 把合并结果推回服务器
// 关键点：先合并再推送，保证“还没推上去的本地改动”绝不会被一次拉取冲掉
function syncNow(){
  if(!syncEnabled()) return;
  setSyncStatus('syncing');
  const url = apiBase() + '/api/state?k=' + encodeURIComponent(SYNC.key || '');
  fetch(url)
    .then(function(r){ if(!r.ok) throw new Error('pull'); return r.json(); })
    .then(function(remote){
      mergeIntoLocal(remote && remote.data);
      const blob = { updatedAt: Date.now(), data: { edits: edits, marks: marks, added: added } };
      return fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(blob) });
    })
    .then(function(){ setSyncStatus('ok'); })
    .catch(function(){ setSyncStatus('err'); });
}

// 生成新增题目的唯一 id
let nextId = Math.max(0, ...QUESTIONS.map(q=>q.id), ...added.map(q=>q.id)) + 1;

// ====== 工具函数 ======
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// 判断某行是否为要点（带序号/项目符号）
function isBullet(line){
  return /^[①②③④⑤⑥⑦⑧⑨⑩]/.test(line)
      || /^（?\d+[)）.、]/.test(line)
      || /^[a-zA-Z]\./.test(line)
      || /^（\d+）/.test(line);
}
// 将答案文本渲染为带换行与要点样式的 HTML
function renderAnswerBody(text){
  return String(text).split('\n').map(function(l){
    const cls = isBullet(l) ? 'al bullet' : 'al';
    return '<div class="'+cls+'">'+escapeHtml(l)+'</div>';
  }).join('');
}

// ====== 单张卡片构建 ======
function createCard(q){
  const card = document.createElement('div');
  card.className = 'card' + (marks[q.id] ? ' weak' : '');
  card.dataset.id = q.id;
  card.dataset.cat = q.category;

  /* --- 头部：不熟练方框 + 题干 + 操作 --- */
  const head = document.createElement('div');
  head.className = 'card-head';

  // 不熟练方框
  const weak = document.createElement('button');
  weak.type = 'button';
  weak.className = 'weak-box' + (marks[q.id] ? ' on' : '');
  weak.title = '标记不熟练';
  weak.textContent = marks[q.id] ? '✓' : '';
  weak.addEventListener('click', function(e){
    e.stopPropagation();
    if(marks[q.id]){ delete marks[q.id]; card.classList.remove('weak'); weak.classList.remove('on'); weak.textContent=''; }
    else { marks[q.id]=true; card.classList.add('weak'); weak.classList.add('on'); weak.textContent='✓'; }
    saveJSON(STORE.marks, marks);
    schedulePush();
  });

  // 题干（点击可切换答案）
  const stem = document.createElement('div');
  stem.className = 'stem';
  const num = document.createElement('span'); num.className='qnum';
  num.textContent = (typeof q.num === 'number') ? (q.num + '.') : q.num;
  const badge = document.createElement('span');
  badge.className = 'lvl ' + (q.level==='重要级' ? 'lvl-imp' : 'lvl-sec');
  badge.textContent = q.level;
  const stext = document.createElement('span'); stext.className='stext'; stext.textContent = q.stem;
  stem.appendChild(num); stem.appendChild(badge); stem.appendChild(stext);

  // 操作按钮
  const actions = document.createElement('div');
  actions.className = 'actions';
  const toggleBtn = document.createElement('button');
  toggleBtn.type='button'; toggleBtn.className='toggle-btn'; toggleBtn.textContent='显示答案';
  const editBtn = document.createElement('button');
  editBtn.type='button'; editBtn.className='edit-btn'; editBtn.textContent='编辑';
  actions.appendChild(toggleBtn); actions.appendChild(editBtn);
  if(q.added){
    const del = document.createElement('button');
    del.type='button'; del.className='del-btn'; del.textContent='删除';
    del.addEventListener('click', function(e){
      e.stopPropagation();
      if(confirm('确定删除该自定义题目？')){
        added = added.filter(function(x){ return x.id!==q.id; });
        saveJSON(STORE.added, added); schedulePush();
        card.remove(); buildNav(); updateCount();
      }
    });
    actions.appendChild(del);
  }

  head.appendChild(weak); head.appendChild(stem); head.appendChild(actions);

  /* --- 答案区 --- */
  const answer = document.createElement('div');
  answer.className = 'answer';
  answer.hidden = true;

  if(q.mnemonic){
    const m = document.createElement('div');
    m.className = 'mnemonic';
    m.innerHTML = '📌 <b>口诀</b>：' + escapeHtml(q.mnemonic);
    answer.appendChild(m);
  }
  const body = document.createElement('div');
  body.className = 'answer-body';
  body.innerHTML = edits[q.id] ? edits[q.id] : renderAnswerBody(q.answer);
  answer.appendChild(body);

  // 编辑工具栏
  const tb = document.createElement('div');
  tb.className = 'edit-toolbar';
  tb.hidden = true;
  function mkBtn(label, cls, fn){
    const b = document.createElement('button');
    b.type='button'; b.className='tb-btn '+(cls||''); b.textContent=label;
    b.addEventListener('mousedown', function(e){ e.preventDefault(); }); // 保持选区
    b.addEventListener('click', function(e){ e.stopPropagation(); fn(); });
    return b;
  }
  tb.appendChild(mkBtn('高亮','',function(){ body.focus(); document.execCommand('styleWithCSS',false,true); document.execCommand('hiliteColor',false,'#fff2a8'); }));
  tb.appendChild(mkBtn('标红','',function(){ body.focus(); document.execCommand('styleWithCSS',false,true); document.execCommand('foreColor',false,'#e23b3b'); }));
  tb.appendChild(mkBtn('划线','',function(){ body.focus(); document.execCommand('underline',false,null); }));
  tb.appendChild(mkBtn('撤销','',function(){ body.focus(); document.execCommand('undo',false,null); }));
  tb.appendChild(mkBtn('重置','warn',function(){ body.innerHTML = renderAnswerBody(q.answer); if(edits[q.id]){ delete edits[q.id]; saveJSON(STORE.edits, edits); schedulePush(); } }));
  tb.appendChild(mkBtn('保存','primary',function(){
    edits[q.id] = body.innerHTML; saveJSON(STORE.edits, edits); schedulePush();
    body.contentEditable='false'; card.classList.remove('editing'); tb.hidden=true;
    editBtn.textContent='编辑'; editBtn.disabled=false;
  }));
  answer.appendChild(tb);

  // 切换显示/隐藏答案
  function toggleReveal(){
    const nowShown = answer.hidden;        // 当前隐藏→即将显示
    answer.hidden = !nowShown;
    card.classList.toggle('revealed', nowShown);
    toggleBtn.textContent = nowShown ? '隐藏答案' : '显示答案';
  }
  toggleBtn.addEventListener('click', function(e){ e.stopPropagation(); toggleReveal(); });
  stem.addEventListener('click', function(){ toggleReveal(); });

  // 进入编辑
  editBtn.addEventListener('click', function(e){
    e.stopPropagation();
    answer.hidden=false; card.classList.add('revealed'); toggleBtn.textContent='隐藏答案';
    body.contentEditable='true'; card.classList.add('editing'); tb.hidden=false;
    editBtn.textContent='编辑中…'; editBtn.disabled=true;
    body.focus();
  });

  card.appendChild(head);
  card.appendChild(answer);
  return card;
}

// ====== 列表渲染 ======
const listEl = document.getElementById('list');
const navEl  = document.getElementById('nav');
const countEl= document.getElementById('count');
const searchEl = document.getElementById('search');

function getAll(){ return QUESTIONS.concat(added); }

function render(){
  listEl.innerHTML = '';
  const kw = searchEl.value.trim();
  let shown = 0;
  getAll().forEach(function(q){
    if(currentCategory !== '全部' && q.category !== currentCategory) return;
    if(kw){
      const hay = q.stem + ' ' + (q.answer||'') + ' ' + (q.mnemonic||'');
      if(hay.indexOf(kw) === -1) return;
    }
    listEl.appendChild(createCard(q));
    shown++;
  });
  countEl.textContent = '当前显示 ' + shown + ' 题';
}

function updateCount(){
  const kw = searchEl.value.trim(); let shown=0;
  getAll().forEach(function(q){
    if(currentCategory!=='全部' && q.category!==currentCategory) return;
    if(kw){ const hay=q.stem+' '+(q.answer||'')+' '+(q.mnemonic||''); if(hay.indexOf(kw)===-1) return; }
    shown++;
  });
  countEl.textContent = '当前显示 ' + shown + ' 题';
}

// ====== 分类导航 ======
function buildNav(){
  navEl.innerHTML = '';
  const cats = ['全部'].concat(CATEGORY_ORDER);
  const counts = {};
  getAll().forEach(function(q){ counts[q.category] = (counts[q.category]||0)+1; });
  counts['全部'] = getAll().length;
  cats.forEach(function(c){
    if(c!=='全部' && !counts[c]) return; // 无题分类不显示
    const b = document.createElement('button');
    b.type='button';
    b.className = 'tab' + (c===currentCategory ? ' active' : '');
    b.textContent = c + ' (' + (counts[c]||0) + ')';
    b.addEventListener('click', function(){
      currentCategory = c; buildNav(); render(); updateCount();
    });
    navEl.appendChild(b);
  });
}

// ====== 顶部批量操作 ======
document.getElementById('btnExpand').addEventListener('click', function(){
  listEl.querySelectorAll('.card').forEach(function(card){
    const ans = card.querySelector('.answer');
    ans.hidden=false; card.classList.add('revealed');
    card.querySelector('.toggle-btn').textContent='隐藏答案';
  });
});
document.getElementById('btnCollapse').addEventListener('click', function(){
  listEl.querySelectorAll('.card').forEach(function(card){
    const ans = card.querySelector('.answer');
    ans.hidden=true; card.classList.remove('revealed');
    card.querySelector('.toggle-btn').textContent='显示答案';
  });
});
document.getElementById('btnReset').addEventListener('click', function(){
  if(!confirm('确定重置所有答案批注与“不熟练”标记？\n（新增题目会保留，仅清空你的标注与标记）')) return;
  edits = {}; marks = {};
  saveJSON(STORE.edits, edits); saveJSON(STORE.marks, marks); schedulePush();
  buildNav(); render(); updateCount();
});
searchEl.addEventListener('input', function(){ render(); updateCount(); });

// ====== 新增题目弹窗 ======
const mask = document.getElementById('modalMask');
const addCat = document.getElementById('addCat');
CATEGORY_ORDER.forEach(function(c){
  const o = document.createElement('option'); o.value=c; o.textContent=c; addCat.appendChild(o);
});
document.getElementById('btnAdd').addEventListener('click', function(){ mask.classList.add('show'); document.getElementById('addStem').focus(); });
document.getElementById('addCancel').addEventListener('click', function(){ mask.classList.remove('show'); });
mask.addEventListener('click', function(e){ if(e.target===mask) mask.classList.remove('show'); });
document.getElementById('addSave').addEventListener('click', function(){
  const stem = document.getElementById('addStem').value.trim();
  const mnem = document.getElementById('addMnem').value.trim();
  const ans  = document.getElementById('addAns').value;
  if(!stem){ alert('请填写题干'); return; }
  const q = { id:nextId++, num:'新', level:'自定义', category:addCat.value, stem:stem, mnemonic:mnem, answer:ans, added:true };
  added.push(q); saveJSON(STORE.added, added); schedulePush();
  mask.classList.remove('show');
  document.getElementById('addStem').value=''; document.getElementById('addMnem').value=''; document.getElementById('addAns').value='';
  buildNav(); render(); updateCount();
});

// ====== 同步设置 / 立即同步 ======
const syncMask = document.getElementById('syncMask');
document.getElementById('btnSyncSettings').addEventListener('click', function(){
  document.getElementById('syncUrl').value = SYNC.url || '';
  document.getElementById('syncKey').value = SYNC.key || '';
  document.getElementById('syncSame').checked = !!SYNC.sameOrigin;
  syncMask.classList.add('show');
});
document.getElementById('syncCancel').addEventListener('click', function(){ syncMask.classList.remove('show'); });
syncMask.addEventListener('click', function(e){ if(e.target===syncMask) syncMask.classList.remove('show'); });
document.getElementById('syncSave').addEventListener('click', function(){
  SYNC.url = document.getElementById('syncUrl').value.trim();
  SYNC.key = document.getElementById('syncKey').value.trim();
  SYNC.sameOrigin = !!document.getElementById('syncSame').checked;
  saveJSON('jzq_sync_v1', SYNC);
  syncMask.classList.remove('show');
  if(syncEnabled()){
    setSyncStatus('syncing');
    syncNow();                  // 一次完整同步：拉取→合并→推送
    if(!window.__syncTimer){ window.__syncTimer = setInterval(syncNow, 20000); }
  } else {
    setSyncStatus('off');
  }
});
document.getElementById('btnSyncNow').addEventListener('click', function(){
  if(!syncEnabled()){ alert('请先在「同步设置」中填写同步服务器地址或勾选同源后端'); return; }
  syncNow();
});

// ====== 初始化 ======
if(syncEnabled()){
  setSyncStatus('syncing');
  syncNow();
  window.__syncTimer = setInterval(syncNow, 20000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) syncNow(); });
} else {
  setSyncStatus('off');
}
buildNav();
render();
updateCount();
</script>
